# TEMPORARY — deleted before this branch merges. Refs: #58
#
# One question, asked cheaply: does a job START on the self-hosted runner while
# the account's hosted runners are refusing with
#   "The job was not started because recent account payments have failed"
#
# Everything else in #58 depends on the answer, so nothing else gets built until
# this has actually run.
name: Runner smoke

on:
  push:
    branches: ['ci/58-**']

permissions:
  contents: read

jobs:
  smoke:
    name: Does a job start at all
    runs-on: [self-hosted, keel]
    steps:
      - name: Report where this ran
        shell: bash
        run: |
          echo "runner name : ${RUNNER_NAME}"
          echo "runner os   : ${RUNNER_OS}"
          echo "commit      : ${GITHUB_SHA}"
