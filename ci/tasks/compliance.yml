# Continuous monitoring & evidence collection. Refs: #42
#
# Scheduled rather than event-driven, because the risk changes while your code
# does not. PERIOD selects the bundle: daily | weekly | monthly | metrics.
platform: linux

image_resource:
  type: registry-image
  source:
    repository: python
    tag: "3.13"

inputs:
  - name: repo

outputs:
  - name: compliance-evidence

params:
  PERIOD: ""
  GITHUB_TOKEN: ""
  REPO_SLUG: ""

run:
  path: bash
  args: [repo/ci/scripts/compliance.sh]
