# PR governance — makes process rules mechanical rather than remembered.
# Controls: CM-3, CM-5, AC-5, AIC-2, AIC-6, AIC-7, SR-3
#
# This is the workflow that enforces the parts of the process a reviewer would otherwise
# have to notice. Everything here is a REQUIRED status check on `main`.

name: PR Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write   # to apply labels and post the governance summary

concurrency:
  group: pr-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governance:
    name: Process compliance
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Enforce governance rules
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const failures = [];
            const warnings = [];

            // ---- Automated dependency PRs: exempt from HUMAN-oriented governance --
            // Dependabot updates are Standard changes (docs/07). A bot can't produce a
            // self-review, an AI-authorship declaration, or a linked issue — demanding them
            // permanently blocks the repo's own supply-chain hygiene, which is worse than
            // the ceremony it skips. These PRs are STILL gated by the real controls: the
            // Dependency review job (SR-3/SR-4/AIC-7), Platform integrity (verifies every
            // action SHA still resolves — the hallucinated-SHA guard), and every scanner.
            // We exempt them here, and rely on those + a human clicking merge.
            const BOT_AUTHORS = ['dependabot[bot]', 'renovate[bot]', 'github-actions[bot]', 'mykronos-platform[bot]'];
            if (BOT_AUTHORS.includes(pr.user.login)) {
              // The one thing we still check: a conventional-commit title, so the changelog
              // stays clean. Everything else is delegated to the scan/integrity jobs.
              const okTitle = /^(feat|fix|chore|build|ci|deps)(\([^)]+\))?!?:\s.+/i.test(pr.title)
                           || /^(bump|update)\s/i.test(pr.title);  // Dependabot's default phrasing
              const note = okTitle
                ? '✅ Automated dependency PR — human governance checks exempted (Standard '
                  + 'change). Still gated by Dependency review, Platform integrity (SHA '
                  + 'resolution), and all scanners. A human merges.'
                : '⚠️ Automated dependency PR with a non-conventional title — merge is fine, '
                  + 'but the changelog will be untidy.';
              core.summary.addRaw('### Governance (bot exemption)\n\n' + note + '\n').write();
              core.info(note);
              return;  // skip the human-oriented checks below
            }

            // ---- CM-3 / CM-5: all change traces to a work item -------------------
            // Accept "Closes #123", "Refs: #123", "Fixes #123", or a bare "#123".
            const issueRef = /(?:closes|fixes|resolves|refs?)\s*:?\s*#(\d+)/i.test(body)
                          || /#\d+/.test(pr.title);
            if (!issueRef) {
              failures.push(
                'No linked issue. Every branch, commit, and PR references a GitHub issue — ' +
                'work with no issue is unauthorized change (CM-3, CM-5). ' +
                'Add "Closes #<n>" to the PR body.');
            }

            // ---- AIC-6: AI authorship declared ----------------------------------
            const aiSection = /##\s*AI authorship/i.test(body);
            const aiDeclared = /\*\*Parts AI-authored:\*\*\s*\S+/i.test(body)
                            || /-\s*\[x\]\s*\*\*Parts AI-authored/i.test(body);
            if (!aiSection || !aiDeclared) {
              failures.push(
                'AI authorship not declared (AIC-6). State which parts were AI-authored ' +
                '(or "none"), which agent/model, and what you verified personally. ' +
                'Concealing AI authorship is a process violation.');
            }

            // ---- AIC-9: reviewer calibration — the author states what they verified
            const verified = /what I verified personally[^\n]*\n?\s*[-*]?\s*\S{15,}/i.test(body);
            if (aiDeclared && !verified) {
              warnings.push(
                'The "what I verified personally" field looks empty or thin. Agent output is ' +
                'usually right, which is what makes complacent review dangerous (AIC-9).');
            }

            // ---- DoD checklist present and engaged -------------------------------
            const dodPresent = /##\s*Definition of Done/i.test(body);
            const unchecked = (body.match(/- \[ \]/g) || []).length;
            const checked   = (body.match(/- \[[xX]\]/g) || []).length;
            if (!dodPresent) {
              failures.push('Definition of Done checklist missing. Use the PR template.');
            } else if (checked === 0) {
              failures.push(
                `Definition of Done checklist is entirely unchecked (${unchecked} items). ` +
                'A PR with an untouched DoD is closed, not fixed in review.');
            } else if (unchecked > 0) {
              warnings.push(`${unchecked} Definition of Done item(s) still unchecked.`);
            }

            // ---- "What I made worse" — honesty prompt ----------------------------
            if (!/##\s*What I made worse/i.test(body)) {
              warnings.push(
                'The "What I made worse" section is missing. A PR claiming to improve ' +
                'everything and worsen nothing is one reviewers learn to distrust.');
            }

            // ---- Conventional commit title ---------------------------------------
            if (!/^(feat|fix|chore|docs|refactor|test|sec|perf|build|ci|revert)(\([^)]+\))?!?:\s.+/
                  .test(pr.title)) {
              failures.push(
                'PR title is not a Conventional Commit. Expected ' +
                '"<type>(<scope>): <summary>" with type in ' +
                'feat|fix|chore|docs|refactor|test|sec|perf|build|ci|revert.');
            }

            // ---- Review-quality signal: oversized PRs -----------------------------
            const changed = pr.additions + pr.deletions;
            if (changed > 400) {
              warnings.push(
                `This PR changes ${changed} lines. Past ~400 lines reviewers degrade to ` +
                'skimming and everyone involved knows it. Consider splitting.');
            }

            // ---- Labels for downstream measurement (AIC-6) ------------------------
            const labels = [];
            if (aiDeclared && !/\*\*Parts AI-authored:\*\*\s*(none|n\/a)/i.test(body)) {
              labels.push('ai-authored');
            }
            if (/-\s*\[[xX]\][^\n]*Security-relevant/i.test(body)
                || /\*\*Security-relevant\?\*\*\s*yes/i.test(body)) {
              labels.push('security-relevant');
            }
            if (/##\s*AI feature changes/i.test(body)
                && /-\s*\[[xX]\][^\n]*AI Impact Assessment/i.test(body)) {
              labels.push('ai-relevant');
            }
            if (labels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number, labels,
              });
            }

            // ---- SOLO MODE: the self-review artifact replaces a reviewer's approval ----
            // In solo mode required_approving_review_count is 0, so nothing else forces a
            // second look. This check is the compensating control from POAM-008: if no one
            // else approved, the author must have produced a self-review record.
            // Without this, "solo mode" is just "no review".
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number,
            });
            const approvedByOther = reviews.some(
              r => r.state === 'APPROVED' && r.user && r.user.login !== pr.user.login);

            if (!approvedByOther) {
              // ── THIS CHECKS FOR A RECORD, NOT A HEADING (#44) ──────────────────
              // It used to pass on `/##\s*Self-review/`, i.e. on the presence of a
              // markdown heading. The PR template instructs authors to write exactly
              // that heading, so the default path through the process satisfied the
              // compensating control for POAM-008 before a word of review existed.
              // Found when a PR whose body said, under that heading, that no record
              // existed — passed.
              //
              // Now: the body must reference a self-review artifact, that file must
              // exist in the checkout (fetch-depth 0 above), and it must have real
              // content in the two sections that make the rest credible.
              // The logic lives in scripts/selfreview-check.js so it can be tested —
              // test/selfreview-check.test.js, 13 assertions, mutation-verified, run by
              // the platform-integrity job below. This check is the whole of AC-5's
              // substitute under solo operation; it does not get to be untested again.
              const fs = require('fs');
              const { evaluate } = require(
                `${process.env.GITHUB_WORKSPACE}/scripts/selfreview-check.js`);

              const selfReview = evaluate({
                body,
                prNumber: pr.number,
                exists: (p) => fs.existsSync(p),
                readFile: (p) => fs.readFileSync(p, 'utf8'),
              });
              failures.push(...selfReview.failures);
              warnings.push(...selfReview.warnings);
              const record = selfReview.found;
              const recordPath = selfReview.recordPath;

              // Cooling-off. A PR opened and merged in the same session has been re-read by
              // the person who just wrote it, holding the same mental model — not reviewed.
              const ageHours = (Date.now() - new Date(pr.created_at).getTime()) / 3.6e6;
              if (ageHours < 4) {
                warnings.push(
                  `This PR is ${ageHours.toFixed(1)}h old and has no independent approval. ` +
                  'Cooling-off: do not merge the session you opened it. A cold read is the ' +
                  'cheapest review capacity a solo operator has, and it is free.');
              }
              core.summary.addRaw(
                `\n> **Solo mode** — no independent approval. Self-review record: ` +
                `${record ? recordPath : 'MISSING'}. PR age: ${ageHours.toFixed(1)}h.\n`);
            }

            // ---- Report -----------------------------------------------------------
            const lines = [];
            if (failures.length) {
              lines.push('### ❌ Governance failures\n');
              failures.forEach(f => lines.push(`- ${f}`));
              lines.push('');
            }
            if (warnings.length) {
              lines.push('### ⚠️ Warnings\n');
              warnings.forEach(w => lines.push(`- ${w}`));
              lines.push('');
            }
            if (!failures.length && !warnings.length) {
              lines.push('### ✅ Governance checks passed');
            }
            core.summary.addRaw(lines.join('\n')).write();

            if (failures.length) {
              core.setFailed(
                `${failures.length} governance failure(s). These are process controls ` +
                `(CM-3, CM-5, AIC-6), not style preferences.`);
            }

  platform-integrity:
    name: Platform integrity (AIC-3, AIC-8, AU-9)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install parser
        run: pip install pyyaml

      # Replaces the ADAPT stub that previously stood in for this check. Verifies agent
      # tool grants match docs/compliance/ai-inventory.md, skills are registered, actions
      # are SHA-pinned, workflows declare least-privilege permissions, and no generated
      # evidence has been hand-placed in the tree.
      - name: Validate platform integrity
        run: python scripts/validate-platform.py

      # Per the control-assessment skill: TEST beats EXAMINE. Three real defects in these
      # guards were found only by exercising them (POAM-002/003/004), including one that
      # blocked edits REMOVING a secret. Four assertions are regression tests for those.
      - name: Guard hook self-test
        run: bash .claude/hooks/selftest.sh

      # The dashboard generator has real logic (truncation disclosure, escaping, degraded
      # rendering). Its tests are mutation-verified — removing the truncation notice or the
      # escaper each fails 2 assertions.
      - name: Dashboard generator tests
        run: python test/dashboard.test.py

      # The solo-mode self-review check (#44). It passed on a markdown heading for
      # months — the one the PR template tells authors to write — so the compensating
      # control for POAM-008 was satisfied before any review happened. Every assertion
      # in here is a negative case, and the suite is mutation-verified: removing the
      # path confinement, the existence check, the section-content test, the
      # none-rejection or the length floor each fails at least one.
      - name: Self-review check tests (POAM-008, #44)
        run: node test/selfreview-check.test.js

  dependency-review:
    name: Dependency review (SR-3, SR-4, AIC-7)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Fails on NEW High/Critical vulnerabilities and disallowed licenses.
      # Gating on new-only is deliberate: gating on the absolute count in a real
      # codebase means the pipeline is red forever and everyone learns to ignore it.
      # Dependency review needs the dependency graph, which requires GitHub Advanced
      # Security on PRIVATE repositories (it is free on public ones). Rather than failing
      # the gate for a licensing reason — or, worse, hiding it behind continue-on-error and
      # reporting green — detect the condition and say so. GP-4: detection fails open,
      # LOUDLY. The compensating control is the grype filesystem scan in security.yml,
      # which works on any repo.
      - name: Is dependency review available?
        id: depcap
        run: |
          priv='${{ github.event.repository.private }}'
          if [ "$priv" = "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Dependency review SKIPPED"
              echo ""
              echo "Requires GitHub Advanced Security on private repositories."
              echo "**This means PR-time dependency review is NOT running (RA-5, SR-3).**"
              echo ""
              echo "Compensating: grype filesystem scan in \`security.yml\`, plus Dependabot."
              echo "Tracked as POAM-005. Making the repo public would close it at no cost."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dependency review
        if: steps.depcap.outputs.available == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # Adjust to your policy. Copyleft licenses often need legal review rather than
          # a blanket block — decide deliberately rather than inheriting a default.
          deny-licenses: AGPL-3.0, GPL-3.0

      # AIC-7: models hallucinate plausible package names and attackers register them
      # ("slopsquatting"). Any manifest change gets a human eye on the package identity.
      - name: Flag manifest changes for package-identity verification
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const manifests = files.filter(f => /(?:package\.json|requirements.*\.txt|pyproject\.toml|go\.mod|Cargo\.toml|Gemfile|pom\.xml|build\.gradle)$/.test(f.filename));
            if (!manifests.length) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['dependency-change'],
            });
            core.summary.addRaw([
              '### 📦 Dependency manifest changed — verify package identity (AIC-7)',
              '',
              manifests.map(m => `- \`${m.filename}\``).join('\n'),
              '',
              'For each **new** package confirm, and record in the PR:',
              '- the publisher and source repository are the ones you intend',
              '- download history and maintenance signal look real',
              '- the name is not a near-miss of a popular package',
              '',
              'Models hallucinate plausible package names; attackers register the popular',
              'hallucinations. This check is cheap and the failure is a supply-chain compromise.',
            ].join('\n')).write();
