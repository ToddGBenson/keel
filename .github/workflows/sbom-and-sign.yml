# Supply chain — build once, inventory it, sign it, attest it, verify it.
# Controls: CM-8, CM-14, SI-7, SR-3, SR-4, SR-4(3), SR-11
#
# ── ONE ARTIFACT, PROMOTED ────────────────────────────────────────────────────
# The artifact tested in staging is byte-identical to the one that reaches production.
# Never rebuild per environment — a rebuild invalidates every test that came before it,
# and it is how "it worked in staging" becomes an incident. Configuration is injected at
# deploy time; the artifact is immutable and referenced by digest, never by a mutable tag.
#
# A signature nobody verifies is decoration. The verify job below is not optional — the
# deploy path must refuse an artifact whose signature or provenance does not check out.

name: Supply Chain

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-attest:
    name: Build, SBOM, sign, attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # OIDC — keyless signing, no long-lived keys (IA-5)
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the immutable artifact
        id: build
        run: |
          echo "ADAPT: build once, reproducibly where the toolchain allows."
          echo "Emit the artifact digest as an output — deploys reference the DIGEST."
          echo "digest=sha256:PLACEHOLDER" >> "$GITHUB_OUTPUT"

      # ── CM-8: component inventory ────────────────────────────────────────────
      # This is the artifact that turns the next Log4Shell from a two-week audit into
      # a one-hour query. It is also what makes the SBOM diff at G5 meaningful.
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90   # artifact lifetime + 3 years in the evidence store

      - name: Diff SBOM against the previous build
        run: |
          echo "ADAPT: fetch the previous release SBOM and diff component sets."
          echo "An unexpected component delta is a supply-chain signal — investigate before"
          echo "shipping. This diff is presented at G5 (change record item 10)."

      # ── SR-4 / SR-4(3): provenance ───────────────────────────────────────────
      # Answers: what source commit, what builder, what inputs produced this artifact.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'sbom.cdx.json'   # ADAPT: point at your real build output

      - name: Attest the SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: 'sbom.cdx.json'   # ADAPT
          sbom-path: 'sbom.cdx.json'

      # ── CM-14 / SR-11: signing ───────────────────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign the artifact (keyless, OIDC)
        run: |
          echo "ADAPT: cosign sign --yes <registry>/<image>@${{ steps.build.outputs.digest }}"
          echo "Keyless via OIDC — no long-lived signing keys to manage or leak (IA-5)."

  verify:
    name: Verify signature and provenance (SR-4(3), SI-7)
    needs: build-and-attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # This job exists because a signature nobody verifies is decoration. The same
      # verification MUST run in the deploy path and MUST refuse on mismatch — verifying
      # only here proves the signature was made, not that it is checked before use.
      - name: Verify
        run: |
          echo "ADAPT: cosign verify \\"
          echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.*' \\"
          echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
          echo "  <registry>/<image>@${{ needs.build-and-attest.outputs.digest }}"
          echo ""
          echo "gh attestation verify <artifact> --repo ${{ github.repository }}"
          echo ""
          echo "Failure here is a hard block. An unverifiable artifact does not deploy."
