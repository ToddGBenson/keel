# Continuous integration — build, test, coverage, lint.
# Controls: SA-11, SA-15, CM-3(2)
#
# Target: PR feedback under 10 minutes. Slow pipelines get bypassed, and a bypassed
# control is worse than an honest absence of one because it still shows green on the
# assessment. Affected tests on PR, full suite on merge.
#
# ── ADAPT ME ──────────────────────────────────────────────────────────────────
# The language-specific commands are yours to replace. The STRUCTURE is the process
# control: required checks, coverage that cannot drop, fail-on-new not fail-on-total.
#
# ── THESE WERE STUBS UNTIL 2026-08-13 ─────────────────────────────────────────
# Build, Lint and Test are three of `main`'s eleven required status checks, and all
# three used to `echo "ADAPT: ..."` and exit 0. Three required checks that verified
# nothing, on a repository whose largest body of code — 3,785 lines of shell across
# 28 files — had no linter at all.
#
# Two of this session's High defects were shell bugs. shellcheck catches one of them
# outright (SC2097/SC2098, the assignment-prefix token bug that broke every Mykronos
# upload); it does not catch the other. One of two is worth having.

name: CI


# ── DISABLED 2026-08-13. Concourse is the delivery pipeline. Refs: #42, #50 ───
# Every lane in this file now lives in ci/pipeline.yml. Triggers reduced to
# workflow_dispatch: the file is kept so the port stays reviewable and so
# restoring PR-time gating is a one-hunk revert, not a rewrite.
#
# It could not run regardless — the repository is private and Actions fail to
# start on billing (POAM-014) — but "cannot run" and "is not configured to run"
# are different statements, and the second is the one that should be true.
#
# WHAT DOES NOT EXIST IN CONCOURSE, and is therefore simply gone:
#   nothing — build, lint and test are all in Concourse.
#
# Restoring PR gating means: fix Actions billing, restore the `on:` block here,
# and re-add the check names to branch protection. All three, or none of it
# takes effect.
on:
  workflow_dispatch:

# Least privilege by default; elevate per job, never globally. (AC-6)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: "80"   # a floor, not a target — coverage measures reach, not quality

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # This repository ships no build artifact — it is a process platform of
      # shell, Python and Markdown. Rather than echo a fake build step, say so
      # in the same shape the scanners use for absent input: a scope statement,
      # not a pass. It becomes a real build the moment there is one to run.
      #
      # ADAPT: replace this with your build, and install from a frozen lockfile
      # so integrity is verified (SR-3, SR-4): `npm ci`, not `npm install`;
      # `pip install -r requirements.txt --require-hashes`; `go mod verify`.
      - name: Is there anything to build?
        run: |
          if [ -f package.json ] || [ -f pyproject.toml ] || [ -f go.mod ]              || [ -f Cargo.toml ] || [ -f pom.xml ]; then
            echo "::error::A build manifest exists but no build step is configured."
            echo "This job would report success without building. Adapt it."
            exit 1
          fi
          {
            echo "### Build: nothing to build"
            echo ""
            echo "No build manifest in this repository, so there is no artifact to"
            echo "produce. **This is a scope statement, not a pass.** The job fails"
            echo "the moment a manifest appears without a build step, so this cannot"
            echo "quietly stay green once there is something to compile."
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint & static typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml

      # The largest language in this repo, and until now the only one with no
      # check of any kind. -S warning: style noise would get this muted.
      - name: shellcheck
        run: |
          shellcheck --version
          mapfile -t files < <(find . -path ./.git -prune -o -name '*.sh' -print | sort)
          echo "Checking ${#files[@]} shell script(s)"
          shellcheck -S warning -f gcc "${files[@]}"

      # Catches syntax errors shellcheck's parser recovers from.
      - name: Shell syntax
        run: find . -path ./.git -prune -o -name '*.sh' -print -exec bash -n {} \;

      - name: Python syntax
        run: python -m compileall -q scripts test src 2>/dev/null || python -m compileall -q scripts test

      - name: JavaScript syntax
        run: find . -path ./.git -prune -o -path ./node_modules -prune -o -name '*.js' -print -exec node --check {} \;

      - name: YAML parses
        run: |
          python - <<'EOF'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('.github/workflows/*.yml') + glob.glob('ci/**/*.yml', recursive=True)
                          + ['platform/MANIFEST.yml', 'automation-policy.yml']):
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
              except Exception as exc:
                  print(f"FAIL {f}: {exc}"); bad = 1
          print("all YAML parses" if not bad else "")
          sys.exit(bad)
          EOF

      # `fly validate-pipeline` checks the schema. This checks the things that
      # have actually broken: a task file that does not exist, a script a task
      # points at that does not exist, a param a job passes that the task never
      # declared, and the no-third-party-resource-types rule the pipeline claims
      # for itself. No Concourse required.
      - name: Concourse pipeline structure
        run: python scripts/validate-pipeline.py

  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # needed to compare coverage against the merge base
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml

      # The repository's actual test suites. These previously ran inside
      # "Platform integrity", which made that job's name untrue and left this one
      # — the job called Test — running nothing.
      - name: Dashboard generator tests
        run: python test/dashboard.test.py

      # 33 assertions, mutation-verified, incl. one against a real filesystem.
      # This is the compensating control for POAM-008; see scripts/selfreview-check.js.
      - name: Self-review check tests (POAM-008)
        run: node test/selfreview-check.test.js

      # TEST beats EXAMINE: three real defects in these guards were found only by
      # exercising them (POAM-002/003/004), including one that blocked edits
      # REMOVING a secret.
      - name: Guard hook self-test
        run: bash .claude/hooks/selftest.sh

      # AIC-12 structural half. The behavioural half needs a live model and is run
      # by the operator monthly — not faked here.
      - name: Agent assurance (AIC-12 structural)
        run: bash evals/run-agent-evals.sh

      # ADAPT: unit and integration tests for your application code, with
      # coverage >= ${COVERAGE_THRESHOLD}% and no drop against main. There is no
      # application code in this repository yet; when there is, a coverage gate
      # goes here and this comment goes away.
      #
      # MUST include the negative-case test for every control the threat model
      # allocated — the test proving the control DENIES is the security evidence.

      - name: Upload test evidence
        if: always()   # evidence of a FAILING run is evidence too
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            **/test-results/**
            **/coverage/**
          retention-days: 90
          if-no-files-found: ignore
