# shellcheck over every shell script. Refs: #42
#
# Its own task because the tool's image is Alpine and the rest of the lint stage
# needs Python. Running the linter from the tool's own image beats installing it
# into a Python image, for the same reason the gitleaks and syft tasks do it.
#
# The report is an output rather than only a log line, so the lint stage can
# assert the check actually ran. A lint job that silently omits the only linter
# for the repository's largest language is exactly the false assurance this
# pipeline keeps rediscovering.
platform: linux

# Half the default cpu weight: these containers share one host with production.
# No memory limit: on these cgroup v2 workers one stops the container being
# created at all (mykronos D-174); the worker containers carry the memory cap.
# See ci/README.md, "Container limits"; test/container-limits.test.py holds it.
container_limits:
  cpu: 512

image_resource:
  type: registry-image
  source:
    repository: koalaman/shellcheck-alpine
    tag: v0.10.0

inputs:
  - name: repo

outputs:
  - name: shellcheck-report
  # json1 for MyKronos (#105, B-051). Its own output, because the uploader takes
  # an entire directory as its results and the report above also holds the
  # file list and the gate's gcc-format text, which it must not try to parse.
  - name: mykronos-results

run:
  path: sh
  args: [repo/ci/scripts/shellcheck.sh]
