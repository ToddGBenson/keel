# Generated by Mykronos Workflow Installer — template version: 1.0.0
# Capability: sast-shell · Repo: ToddGBenson/keel
#
# Do not edit by hand. A template resync will overwrite this file (spec 03 §6).
# To change behaviour, edit this repo's sast-shell capability config in
# Mykronos.

name: Mykronos sast-shell

on:

  pull_request:
    paths:
      - "**/*.sh"
      - "**/*.bash"
      - "**/*.ksh"
      - "**/*.zsh"
  push:
    branches: ["main"]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: mykronos-sast-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-shell:
    name: ShellCheck

    runs-on: ubuntu-latest
    timeout-minutes: 30


    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:

          # Full history: the adapter reads surrounding source to build the
          # snippet fingerprint that gives a finding stable identity
          # (spec 05 §5).
          fetch-depth: 0


      - name: Fail fast if Mykronos is unreachable
        # spec 05 §4. Better to stop in ten seconds than scan for twenty
        # minutes and find at upload time that the results have nowhere to go
        # — and silently skipping is not an option (spec 01 §6).
        #
        # Retried, because one slow answer is not an unreachable platform.
        # On 2026-08-30 seven lanes failed together on `curl: (28) Operation
        # timed out after 20002 milliseconds` while the ingestion host was
        # briefly saturated — it was serving in 0.3s a few minutes either
        # side. A single-shot probe turns a busy minute into seven red checks
        # and a scan that never ran, which is a worse answer than waiting.
        #
        # `--retry-all-errors` is what makes this work: `--retry` alone does
        # not retry a timeout, which is the exact failure observed.
        #
        # Still fails fast in the case it exists for. Three attempts at 15s
        # with a 5s backoff is under a minute, against the twenty a scan
        # would otherwise waste before discovering the same thing.
        run: |
          curl --fail --silent --show-error --max-time 15 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.MYKRONOS_INGESTION_TOKEN }}" \
            "https://mykronos.toddbenson.net/api/ingest/health" > /dev/null


      - name: Find shell scripts
        id: shell
        # By extension *and* by shebang. A repository's most interesting
        # scripts are frequently the ones with no extension -- an installer
        # called `bootstrap`, a hook called `pre-commit` -- and a scan that
        # only globs `*.sh` misses exactly those while reporting success.
        #
        # `.git` is excluded explicitly: it holds sample hooks that ship with
        # git itself, and reporting findings about somebody else's templates
        # is how a new lane's first run reads as noise.
        run: |
          set -uo pipefail
          {
            find . -path ./.git -prune -o -type f \
              \( -name '*.sh' -o -name '*.bash' -o -name '*.ksh' -o -name '*.zsh' \) -print
            find . -path ./.git -prune -o -type f -perm -u+x -print \
              | while read -r candidate; do
                  head -c 64 "$candidate" 2>/dev/null \
                    | grep -qE '^#!.*\b(bash|sh|ksh|zsh)\b' && echo "$candidate"
                done
          } | sed 's|^\./||' | sort -u > "${{ runner.temp }}/shell-files.txt"

          count=$(wc -l < "${{ runner.temp }}/shell-files.txt" | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Found ${count} shell script(s)."

      - name: Scan shell scripts
        # Never fails the step itself: exit codes are the upload step's job,
        # which applies this repo's configured threshold and blocking policy
        # (spec 04 §5). ShellCheck exits 1 whenever it has anything to say,
        # and this lane is expected to have something to say.
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p "${{ runner.temp }}/mykronos-results"

          if [ ! -s "${{ runner.temp }}/shell-files.txt" ]; then
            # An empty report rather than no report. A capability with nothing
            # to scan must still say it looked, or the lane reads as never
            # having run and the cross-check cannot tell the two apart
            # (spec 04 §6).
            echo '{"comments":[]}' > "${{ runner.temp }}/mykronos-results/shellcheck.json"
            echo "::notice::No shell scripts here, so ShellCheck had nothing to read."
            exit 0
          fi

          # `--severity=style` reports everything ShellCheck has, and the
          # filtering happens in Mykronos against this repository's configured
          # threshold (spec 04 §5). A scanner that drops findings before the
          # platform sees them makes the threshold unadjustable without a
          # re-render, and makes "no findings" ambiguous between a clean scan
          # and a narrow one.
          #
          # Mounted read-only: a linter has no reason to write to the tree it
          # is reading, and the scanner is the one step in this workflow
          # running somebody else's container over our source.
          docker run --rm \
            -w /repo \
            -v "${{ github.workspace }}:/repo:ro" \
            koalaman/shellcheck:v0.10.0 \
            --format=json1 --severity=style \
            $(tr '\n' ' ' < "${{ runner.temp }}/shell-files.txt") \
            > "${{ runner.temp }}/mykronos-results/shellcheck.json"
          rc=$?

          # 1 means ShellCheck had something to say, which is a result rather
          # than an error -- this lane exists to have something to say.
          # Everything else is the scanner failing, and blanket-ignoring the
          # exit code would report a clean scan for a scan that broke: the
          # hollow green the pipeline standard forbids (PS-3). The guard test
          # greps the raw step, so this comment does not name the operator it
          # is warning about.
          if [ "$rc" -gt 1 ]; then
            echo "::error::ShellCheck exited ${rc} — the scan did not complete."
            exit "$rc"
          fi

          # ShellCheck writes nothing at all when the container cannot start.
          # An empty file parses as zero findings, which would report a clean
          # scan for a scan that did not happen.
          if [ ! -s "${{ runner.temp }}/mykronos-results/shellcheck.json" ]; then
            echo "::error::ShellCheck produced no output — the scan did not run."
            exit 1
          fi


      - name: Upload results to Mykronos
        # Shared composite action, semver-pinned: every onboarded repo depends
        # on it, so it must never be referenced by branch (spec 04 §2).
        # `always()` because a scan that failed still has to register its
        # ScanRun — "never ran" and "ran and broke" must stay distinguishable
        # in the lake (spec 04 §6, §7).
        if: always()
        uses: ToddGBenson/mykronos/actions/upload-results@cce7495afafb3f22b014847bd91624ced9b8e2dd
        with:
          # The capability this lane *reports*, which is usually the template's
          # own name and is not always. A repository can run two analysers on
          # one capability -- ShellCheck beside CodeQL, because CodeQL
          # implements no shell language (B-051) -- and those are two
          # workflows with two names uploading one capability. The template's
          # name stays distinct so the workflow, the job and the concurrency
          # group do not collide; only what it reports is shared.
          capability: sast

          tool: shellcheck

          results-path: ${{ runner.temp }}/mykronos-results

          ingestion-url: https://mykronos.toddbenson.net
          token: ${{ secrets.MYKRONOS_INGESTION_TOKEN }}
          severity-threshold: low
          blocking: "false"
          # Same ref as the `uses:` line above, resolved when this file was
          # rendered. The action can also fall back to `github.action_ref`, but
          # that is empty inside a composite action, so it is not relied on.
          mykronos-ref: cce7495afafb3f22b014847bd91624ced9b8e2dd



