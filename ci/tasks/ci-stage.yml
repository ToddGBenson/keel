# CI stage — build, lint, test, or full-suite. Refs: #42
#
# One task, four stages, because all four are the same shape: check out, run the
# toolchain, emit evidence. The STAGE param selects which. keel's pipeline runs
# build, lint and test; full-suite is template for forks (TheHub #60850).
platform: linux

# Half the default cpu weight: these containers share one host with production.
# No memory limit: on these cgroup v2 workers one stops the container being
# created at all (mykronos D-174); the worker containers carry the memory cap.
# See ci/README.md, "Container limits"; test/container-limits.test.py holds it.
container_limits:
  cpu: 512

image_resource:
  type: registry-image
  source:
    repository: python
    tag: "3.13"

inputs:
  - name: repo
  # Produced by the shellcheck task; consumed only by STAGE=lint, which FAILS if
  # it is absent rather than treating a missing linter as a pass.
  - name: shellcheck-report
    optional: true

outputs:
  - name: test-evidence

params:
  STAGE: ""

run:
  path: bash
  args: [repo/ci/scripts/ci-stage.sh]
