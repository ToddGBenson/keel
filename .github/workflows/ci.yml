# Continuous integration — build, test, coverage, lint.
# Controls: SA-11, SA-15, CM-3(2)
#
# Target: PR feedback under 10 minutes. Slow pipelines get bypassed, and a bypassed
# control is worse than an honest absence of one because it still shows green on the
# assessment. Affected tests on PR, full suite on merge.
#
# ── ADAPT ME ──────────────────────────────────────────────────────────────────
# Replace the `run:` steps with your toolchain. The STRUCTURE is the process control:
# required checks, coverage that cannot drop, fail-on-new rather than fail-on-total.

name: CI

# ── PR-ONLY since 2026-08-13 — partially ported to Concourse. Refs: #42 ───────
# `push` and `schedule` moved to the `build`, `lint`, `test` and `full-suite`
# jobs in ci/pipeline.yml. `pull_request` stays HERE, deliberately.
#
# Concourse has no first-class pull-request trigger and cannot report a commit
# status back to GitHub without an archived third-party resource. Disabling this
# workflow outright would have left PRs with no build, lint, test or coverage
# gate at all — scanning would have become a post-merge signal on main rather
# than a merge gate. Three of `main`'s required status checks come from this
# file; they still report because this trigger still exists.
#
# The division: GitHub gates the pull request, Concourse owns main and
# everything scheduled. Duplication between them is intentional and cheap.
on:
  pull_request:
  workflow_dispatch:

# Least privilege by default; elevate per job, never globally. (AC-6)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: "80"   # a floor, not a target — coverage measures reach, not quality

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ADAPT: language setup + dependency cache.
      # Cache dependencies, never cache RESULTS — a cached test result is not evidence.
      # - uses: actions/setup-node@... with: { node-version: '22', cache: 'npm' }
      # - uses: actions/setup-python@... with: { python-version: '3.12', cache: 'pip' }

      - name: Install dependencies
        run: |
          echo "ADAPT: install with a frozen lockfile — integrity verified (SR-3, SR-4)"
          # npm ci            # not `npm install`
          # pip install -r requirements.txt --require-hashes
          # go mod download && go mod verify

      - name: Build
        run: |
          echo "ADAPT: build command"

  lint:
    name: Lint & static typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Lint
        run: |
          echo "ADAPT: linter"
      - name: Static typing
        run: |
          echo "ADAPT: type checker"
      - name: Format check
        run: |
          echo "ADAPT: formatter --check"

  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    # ADAPT: real collaborators for integration tests. Unit-mocked authz proves nothing
    # about the real authorizer, and mocked persistence proves nothing about migrations.
    # services:
    #   postgres:
    #     image: postgres:17
    #     env: { POSTGRES_PASSWORD: postgres }
    #     options: >-
    #       --health-cmd pg_isready --health-interval 10s
    #       --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # needed to compare coverage against the merge base

      - name: Unit tests
        run: |
          echo "ADAPT: unit test command with coverage output"

      - name: Integration tests
        run: |
          echo "ADAPT: integration tests against real collaborators"
          echo "MUST include the negative-case tests for every allocated control —"
          echo "the test proving the control DENIES is the security evidence (SA-11)."

      - name: Coverage threshold
        run: |
          echo "ADAPT: assert coverage >= ${COVERAGE_THRESHOLD}%"
          # A coverage DROP vs. main fails even when above the threshold — otherwise a
          # large untested change passes by diluting an already-high number.

      - name: Upload test evidence
        if: always()   # evidence of a FAILING run is evidence too
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            **/test-results/**
            **/coverage/**
          retention-days: 90
          if-no-files-found: warn

  # The post-merge full suite lived here, gated on
  # `github.event_name == 'push' && github.ref == 'refs/heads/main'`. With the
  # push trigger gone that condition can never be true, so the job is removed
  # rather than left as config that looks active and never runs.
  #
  # It is now the `full-suite` job in ci/pipeline.yml, which runs on every main
  # commit after build, lint and test pass.
