# Branch-protection drift. Refs: TheHub #60979
#
# Runs `scripts/configure-github.sh --verify-only`: GET requests only, one
# `match` or `DRIFT` line per field .sdlc/protection.yaml declares, red on any
# DRIFT and red when the protection cannot be read.
platform: linux

# Half the default cpu weight: these containers share one host with production.
# No memory limit: on these cgroup v2 workers one stops the container being
# created at all (mykronos D-174); the worker containers carry the memory cap.
# See ci/README.md, "Container limits"; test/container-limits.test.py holds it.
container_limits:
  cpu: 512

image_resource:
  type: registry-image
  source:
    repository: python
    tag: "3.13"

inputs:
  - name: repo

params:
  # Fine-grained, Administration: read-only, this repository only. From the
  # credential manager; an empty value fails the task (ci/scripts/protection-drift.sh).
  GH_TOKEN: ""
  REPO_SLUG: ""

run:
  path: bash
  args: [repo/ci/scripts/protection-drift.sh]
