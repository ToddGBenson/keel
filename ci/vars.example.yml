# Non-secret pipeline vars. Refs: #42
#
#   cp ci/vars.example.yml ci/vars.yml     # ci/vars.yml is gitignored
#   fly -t <target> set-pipeline -p keel -c ci/pipeline.yml -l ci/vars.yml
#
# SECRETS DO NOT BELONG IN THIS FILE OR IN ci/vars.yml. Every ((var)) named in
# the "supplied by the credential manager" list at the bottom is looked up at
# build time from Vault / CredHub / Kubernetes secrets. Passing them with -l puts
# them in the pipeline config, where `fly get-pipeline` will happily print them
# back out to anyone on the team.
#
# ── TOOL PINS ─────────────────────────────────────────────────────────────────
# Resolved 2026-08-13 against upstream releases. Every checksum below was taken
# from the publisher's own checksums file, not computed locally from a download —
# hashing whatever arrived only proves the bytes did not change in transit, which
# is what TLS already told you.
#
# To refresh a pin:
#   grype   https://github.com/anchore/grype/releases        grype_<v>_checksums.txt
#   cosign  https://github.com/sigstore/cosign/releases      cosign_checksums.txt
#   trivy   https://github.com/aquasecurity/trivy/releases   trivy_<v>_checksums.txt
#   codeql  https://github.com/github/codeql-action/releases codeql-bundle-linux64.tar.gz.checksum.txt
#   checkov https://pypi.org/project/checkov/#history        (pip verifies the wheel)
#
# These are pins, not floors. Bumping one is a change like any other: it goes
# through a PR, and the scanner's own output is the regression test.

# ── Repository ────────────────────────────────────────────────────────────────
git_uri: https://github.com/ToddGBenson/keel.git
github_owner: ToddGBenson
github_repo: keel
github_user: x-access-token          # with a PAT as the password

# ── Concourse ─────────────────────────────────────────────────────────────────
# Used in evidence records so a build URL in an audit trail actually resolves.
#
# NOTE: this is a loopback address. Build URLs written into Atlas evidence and
# G5 authorization records will not resolve for anyone but the operator on this
# machine. That is a real limitation of an audit trail — repoint it the moment
# this Concourse gets a routable address.
concourse_external_url: http://localhost:8080

# ── Mykronos ──────────────────────────────────────────────────────────────────
mykronos_ingestion_url: https://mykronos.toddbenson.net

# The `mykronos` package ref. Pinned to the same commit the Actions workflows
# used, so the uploader, the adapters and the FindingSubmission schema are
# byte-identical to what was ingesting before the port. Never a branch.
mykronos_ref: 8b329fc5c1f739eab8ad40b8a7628da7cd1ee935

# ── CodeQL ────────────────────────────────────────────────────────────────────
# The bundle is what actually performs the SAST analysis, so it is verified
# against the checksum GitHub publishes beside it. Confirmed against two
# independent sources: the release API's asset digest and
# codeql-bundle-linux64.tar.gz.checksum.txt. They agree.
#
# ⚠️  SIZE: this asset is 846 MB, downloaded on every `sast` and `mykronos-sast`
# run. On a self-hosted worker that is bandwidth and minutes per build. If it
# becomes a problem, the .tar.zst variant is 602 MB and needs zstd in the task
# image, or cache the extracted bundle on the worker — but never swap a pinned,
# checksum-verified download for an unverified cache.
codeql_bundle_version: v2.26.3
codeql_bundle_sha256: 77e5be1b550d66662e600e795b6cf2ea1729e853e3dc79e02594f767039d2a29

# ── Grype (SCA) ───────────────────────────────────────────────────────────────
# Asset: grype_<version>_linux_amd64.tar.gz
grype_version: 0.117.0                # no leading v; the script adds it
grype_sha256: 38525dab1e06f162ebaa02f94d82d1f807076b011a44180cf2777edf1a7b9c26

# ── Checkov (IaC) ─────────────────────────────────────────────────────────────
# Installed from PyPI, so pip verifies the wheel against the index. No separate
# checksum var — adding one would imply a verification this does not perform.
checkov_version: 3.3.10

# ── Trivy (containers) ────────────────────────────────────────────────────────
# Pinned now so the lane is ready, though it stays inert until IMAGE_REF is set.
# Asset: trivy_<version>_Linux-64bit.tar.gz
trivy_version: 0.73.0
trivy_sha256: 2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b

# ── Cosign (signing) ──────────────────────────────────────────────────────────
# Asset: cosign-linux-amd64
cosign_version: 3.1.3                 # no leading v; the script adds it
cosign_sha256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71

# ── Deploy targets ────────────────────────────────────────────────────────────
# NOT YET APPLICABLE — deliberately empty, not CHANGEME.
#
# This repository does not build or ship a deployable artifact yet: the build
# step in ci/scripts/ci-stage.sh is an ADAPT stub, container-scan has no trigger,
# and the supply-chain and release lanes are stubs around real cosign calls.
# Filling these in with plausible values would make four inert lanes look
# configured. Set them in the same change that makes the build real.
registry: ""
staging_url: ""
production_url: ""

# ══════════════════════════════════════════════════════════════════════════════
# SUPPLIED BY THE CREDENTIAL MANAGER — never put these in a -l file
# ══════════════════════════════════════════════════════════════════════════════
#
#   ((github_token))              repo read; PR governance stays on Actions, so
#                                 this needs no write scope
#   ((webhook_token))             shared secret in the GitHub webhook URL
#   ((mykronos_ingestion_token))  scoped to this repository, with the sast,
#                                 secrets and atlas capabilities granted
#   ((anthropic_api_key))         eval harness only
#   ((registry_user))
#   ((registry_password))
#
# With Vault at the default paths, Concourse resolves ((foo)) from
#   /concourse/<team>/<pipeline>/foo   then   /concourse/<team>/foo
# so team-wide credentials can live one level up. See ci/README.md.
