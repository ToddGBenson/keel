# SAST via the CodeQL CLI. Refs: #42
#
# The Actions version used github/codeql-action, which does not exist outside
# Actions. This runs the CodeQL CLI from the same bundle that action downloads,
# so the analysis is the same analysis — the queries, the extractors and the
# suites all come from `codeql-bundle-linux64.tar.gz`.
#
# CODEQL_BUNDLE_SHA256 has no default on purpose. The bundle is the thing doing
# the security analysis; fetching it unverified would undercut the job. Compute
# it once and pin it — see ci/README.md.
platform: linux

# Half the default cpu weight: these containers share one host with production.
# No memory limit: on these cgroup v2 workers one stops the container being
# created at all (mykronos D-174); the worker containers carry the memory cap.
# See ci/README.md, "Container limits"; test/container-limits.test.py holds it.
container_limits:
  cpu: 512

image_resource:
  type: registry-image
  source:
    repository: python
    tag: "3.13"

inputs:
  - name: repo

outputs:
  - name: mykronos-results

params:
  CODEQL_LANGUAGE: ""
  CODEQL_QUERIES: security-extended
  CODEQL_BUNDLE_VERSION: ""
  CODEQL_BUNDLE_SHA256: ""
  UPLOAD_TO_MYKRONOS: "false"
  # Only the keel-owned lane gates. The Mykronos lane leaves blocking policy to
  # the uploader, which applies this repository's configured threshold.
  FAIL_ON_SECURITY_FINDING: "false"

run:
  path: bash
  args: [repo/ci/scripts/codeql.sh]
