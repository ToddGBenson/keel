# Build once, inventory it, sign it, verify it. Refs: #42
#
# STAGE selects: build-and-attest | verify.
#
# ── A CAPABILITY THAT DID NOT SURVIVE THE PORT ────────────────────────────────
# The Actions version used actions/attest-build-provenance and actions/attest-sbom,
# which write to GitHub's attestation store and are verifiable with
# `gh attestation verify`. There is no Concourse equivalent and no way to write to
# that store from outside Actions.
#
# cosign keyless signing carries over and is the stronger half. The GitHub
# attestation store does not. This is recorded in docs/compliance/poam.md rather
# than quietly dropped.
platform: linux

image_resource:
  type: registry-image
  source:
    repository: python
    tag: "3.13"

inputs:
  - name: repo
  # OPTIONAL at the task level, MANDATORY at the build-and-attest stage.
  #
  # This input was made required to fix the opposite defect: build-and-attest
  # took an optional `sbom` that nothing in its plan produced, so the "no SBOM"
  # branch ran every time and `optional: true` turned a structural wiring error
  # into a warning nobody read.
  #
  # Making it required broke the sibling. `verify-artifact` shares this task
  # file, does not need an SBOM, and has no step that produces one — so every run
  # errored with `missing inputs: sbom` before a single step executed. A fix
  # applied to a shared file without checking its other consumer (L0008).
  #
  # So: optional here, and ci/scripts/supply-chain.sh FAILS HARD when
  # STAGE=build-and-attest and no SBOM arrived. The requirement lives where the
  # requirement actually is, instead of on every consumer of the file.
  - name: sbom
    optional: true

outputs:
  - name: artifact

params:
  STAGE: ""
  COSIGN_VERSION: ""
  COSIGN_SHA256: ""
  REGISTRY: ""

run:
  path: bash
  args: [repo/ci/scripts/supply-chain.sh]
