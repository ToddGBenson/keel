# Release — G5. THE ONE RELEASE PATH. Refs: #42, TheHub #60935
# Controls: CM-3, CM-4, CM-5, SA-10, AU-2, AC-5
#
# ── ONE PATH (POAM-016, closed 2026-10-22) ────────────────────────────────────
# Until 2026-10-22 there were two release paths and they disagreed:
#
#   * this workflow, which ADR-0003 §D2 named "the live G5 path", described a
#     staging deploy and a production deploy to a PRODUCTION_URL. ADR-0004 says
#     keel has no artifact and no production environment, so every one of those
#     steps was an `echo "ADAPT: ..."` that would have exited 0;
#   * Concourse `release-preflight` → `authorize-release`, which ADR-0004 §D2
#     named the release lane. Its preflight ran real checks. Its authorisation
#     was a job with no trigger: pressing it WAS approving it, nothing required
#     the approver to differ from the author, and it had never run (POAM-010).
#
# This file is now the only one. It keeps what was true in each: the Concourse
# preflight's checks (same three validators, same order) and this workflow's
# authorisation, which is a technical control rather than a button. The
# Concourse jobs, ci/tasks/release.yml and ci/scripts/release.sh are deleted.
#
# ── WHAT A KEEL RELEASE IS ───────────────────────────────────────────────────
# A tag. keel ships no artifact (ADR-0004). Forks take a tagged version through
# scripts/sync-platform.sh, which fast-forwards platform-owned paths over their
# local edits by design. So a bad release reaches every fork, and the
# authorisation matters more here than it would for one deploy, not less.
#
# What a release carries: `sign-and-attest` (below) signs a manifest of every
# platform-owned file keylessly and attests its provenance, and publishes both
# on the GitHub release. Concourse `verify-artifact` verifies the latest one
# and fails when it is unsigned (#144, POAM-011).
#
# A fork that DOES deploy a service adds its staging and production jobs after
# `authorize-release` (`needs: authorize-release`), deploying by digest. See
# docs/07-release-and-change.md. The template does not ship them as `echo`
# stubs: a step that prints ADAPT and exits 0 is a green build that asserts
# nothing (ci/README.md, "A stub is not an inert lane").
#
# ── THE GATE IS THE ENVIRONMENT ──────────────────────────────────────────────
# `authorize-release` runs in the `production` environment. Its required
# reviewers mean the job cannot start until a named human approves in the
# GitHub UI. The environment keeps its old name so the protection rule it
# already carries is not recreated.
#
# The environment must ALSO allow tags. Release runs against a tag (below), and
# an environment limited to protected branches refuses every tag ref. As
# measured 2026-10-22 keel's `production` was `protected_branches: true`, so
# no tag could ever have reached the gate. scripts/configure-github.sh now
# sets a custom policy: `main` and tags matching `v*`.
#
# Run it: Actions → Release → Run workflow → choose the TAG as the ref.

name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight — is this version fit to release?
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: The ref must be a tag
        # First, before anything else is checked. The version comes from the
        # ref, so dispatching from a branch would authorise "main" as a release.
        # checkov CKV_GHA_7 (#79): no free-text input reaches this workflow at
        # all now. The change record path is derived from the tag too.
        # The ref reaches the shell through `env:`, never `${{ }}` inside `run:`:
        # a ref name may contain `$(`, and an expression is pasted into the
        # script before bash parses it.
        if: github.ref_type != 'tag'
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::Dispatched against $REF_TYPE '$REF_NAME'."
          echo "::error::Release runs against the TAG being released. Re-dispatch with"
          echo "::error::the tag selected as the ref."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0             # origin/main, for the check below
          persist-credentials: false

      - name: The tagged commit must be on main
        # A courtesy, not the control: whoever pushes a tag also chooses the
        # release.yml that runs, and can delete this step. The control is the
        # verifier (scripts/platform-release.sh verify --trusted-ref), which
        # Concourse and every fork run from main and which refuses a signature
        # made on a commit that is not on main. This step only stops an honest
        # mistake before a human is asked to approve it. (Review of #145, finding 1)
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit $GITHUB_SHA is not on main. Release only a commit that is on main:"
            echo "::error::verify-artifact and every fork refuse a signature made anywhere else."
            exit 1
          fi
          echo "tag commit $GITHUB_SHA is on origin/main"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: The delivery contract — every path governed, every shipped path present
        run: |
          python -m pip install --quiet --disable-pip-version-check \
            --require-hashes -r ci/requirements.txt
          python scripts/validate-manifest.py

      - name: The platform's own integrity
        run: python scripts/validate-platform.py

      - name: The pipeline forks inherit
        run: python scripts/validate-pipeline.py

      - name: The change record exists and has all 13 sections
        # docs/07-release-and-change.md: stored at
        # evidence/releases/<version>/change-record.md, committed BEFORE the tag,
        # so the record the approver reads is the one in the tagged tree.
        # Sections 4 (G4 clearance per item) and 5 (open findings, accepted
        # risks) are what the approver reads to decide; this step checks they
        # are there, not that they are right. That judgment is the gate.
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          record="evidence/releases/${VERSION}/change-record.md"
          if [ ! -s "$record" ]; then
            echo "::error::No change record at $record in the tagged tree."
            exit 1
          fi
          missing=0
          for section in "Identifier" "Change class" "Impact analysis" "Gate evidence" \
                         "Security posture" "AI assurance" "Test evidence" "Supply chain" \
                         "Deployment plan" "Rollback plan" "Verification plan" \
                         "Communication" "Authorization"; do
            if ! grep -qiE "^#+ .*${section}" "$record"; then
              echo "::error::$record has no '${section}' section heading."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "change record: $record, 13 of 13 sections present"

  authorize-release:
    name: G5 — authorize the release (HUMAN APPROVAL REQUIRED)
    needs: preflight
    runs-on: ubuntu-latest
    # ── This is the gate. The job blocks until a required reviewer of the
    #    `production` environment approves. No `url:` — there is no service.
    environment:
      name: production
    permissions:
      contents: read
      actions: read   # to read this run's environment approvals, below
    steps:
      - name: Record the approval — and refuse if there is none
        # The environment holding the job is necessary and not sufficient: on
        # 2026-08-13 a visibility change DELETED the `production` reviewer rule
        # and nothing failed. With no rule, this job just starts. So it reads
        # the approval GitHub recorded for THIS run and refuses without one.
        # An admin bypass also leaves no approval, and is refused for the same
        # reason: an authorisation with no approver is not one.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISPATCHED_BY: ${{ github.actor }}
          TRIGGERED_BY: ${{ github.triggering_actor }}
        run: |
          approvals="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals")"
          approver="$(printf '%s' "$approvals" | jq -r \
            '[.[] | select(.state == "approved")
                  | select(any(.environments[]; .name == "production"))
                  | .user.login] | first // empty')"
          if [ -z "$approver" ]; then
            echo "::error::No approval of the 'production' environment is recorded for this run."
            echo "::error::Either the environment lost its required reviewers, or the gate was"
            echo "::error::bypassed. Restore the rule (scripts/configure-github.sh) and re-run."
            exit 1
          fi
          {
            echo "### G5 authorization — platform release"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Change record | \`evidence/releases/$VERSION/change-record.md\` |"
            echo "| Dispatched by | $DISPATCHED_BY (triggering actor: $TRIGGERED_BY) |"
            echo "| **Approved by** | **$approver** (environment \`production\`) |"
            echo "| Approved at | $(date -u +%Y-%m-%dT%H:%M:%SZ) (job start, after approval) |"
            echo "| Run | $RUN_URL |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$approver" = "$DISPATCHED_BY" ]; then
            # Solo operation (POAM-008): the one reviewer is also the one who
            # dispatches. Recorded, not refused, so the record says it plainly.
            echo "::warning::Approver and dispatcher are the same identity ($approver). AC-5 is not met for this release; see POAM-008."
          fi
          echo "authorized: $VERSION by $approver"

  # ── SR-4(3) / CM-14: the release is signed and attested (#144, POAM-011) ─────
  # After the gate, never before: what is signed is what a named human
  # authorised. The subject is a checksum manifest of every platform-owned file
  # at this tag (scripts/platform-release.sh), because that is what forks
  # receive. keel ships no image (ADR-0004).
  #
  # Keyless. The signing identity is this workflow on this tag, issued by
  # GitHub's OIDC provider and recorded in Sigstore's transparency log. There
  # is no signing key to store, rotate or leak (IA-5), and nothing the operator
  # has to provision. Concourse cannot do this: the public Sigstore CA does not
  # trust a self-hosted Concourse's identity.
  sign-and-attest:
    name: Sign and attest the platform release (SR-4(3), CM-14)
    needs: authorize-release
    runs-on: ubuntu-latest
    permissions:
      contents: write      # publish the GitHub release and its two assets
      id-token: write      # the OIDC token IS the signing identity
      attestations: write  # SLSA build provenance in GitHub's attestation store
    env:
      # The same pin as ci/vars.example.yml, so the cosign that signs is the
      # cosign that verifies in Concourse. test/platform-release.test.py
      # fails if the two drift.
      COSIGN_VERSION: "3.1.3"
      COSIGN_SHA256: "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # the tag and origin/main, which the verifier checks it against
          persist-credentials: false

      - name: Install cosign (pinned and checksummed)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Write the platform manifest
        run: |
          bash scripts/platform-release.sh manifest platform-manifest.txt
          echo "$(wc -l < platform-manifest.txt) platform-owned files"

      - name: Sign it (cosign, keyless)
        run: cosign sign-blob --yes --bundle platform-manifest.sigstore.json platform-manifest.txt

      - name: Attest its build provenance (SLSA)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: platform-manifest.txt

      - name: Verify it, and prove an unsigned or altered release is refused
        # The same verifier Concourse's verify-artifact runs. Positive first,
        # against the tagged tree; then three cases that MUST be refused, so a
        # verifier that accepts everything cannot publish a release.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          verify() {
            bash scripts/platform-release.sh verify --repo "$GITHUB_REPOSITORY" \
              --git . --trusted-ref origin/main "$@"
          }
          verify --manifest platform-manifest.txt --bundle platform-manifest.sigstore.json \
                 --tag "$VERSION" --tree .

          refused() { # description, then verify arguments
            local what="$1"; shift
            if verify "$@"; then
              echo "::error::the verifier ACCEPTED $what"; exit 1
            fi
            echo "refused, as it must be: $what"
          }
          refused "a release with no signature" \
            --manifest platform-manifest.txt --bundle "$RUNNER_TEMP/absent.json" --tag "$VERSION"
          # One hex digit of the first file's hash changed; nothing else.
          sed '1s/^0/1/;t;1s/^./0/' platform-manifest.txt > "$RUNNER_TEMP/altered.txt"
          refused "an altered manifest" \
            --manifest "$RUNNER_TEMP/altered.txt" --bundle platform-manifest.sigstore.json --tag "$VERSION"
          refused "a signature checked against another tag" \
            --manifest platform-manifest.txt --bundle platform-manifest.sigstore.json --tag "${VERSION}-other"

          gh attestation verify platform-manifest.txt --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"

      - name: Publish the release with its manifest and signature
        # Concourse verify-artifact checks the LATEST release for these two
        # assets and fails when they are missing.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" --verify-tag --title "$VERSION" \
            --notes "Platform release $VERSION. Verify before syncing: scripts/platform-release.sh verify --manifest platform-manifest.txt --bundle platform-manifest.sigstore.json --repo $GITHUB_REPOSITORY --tag $VERSION --git <a clone of $GITHUB_REPOSITORY with tags> --trusted-ref <its main, e.g. upstream/main> --tree ." \
            platform-manifest.txt platform-manifest.sigstore.json
