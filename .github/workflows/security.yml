# Security scanning — SAST, SCA, secrets, IaC, containers.
# Controls: SA-11(1), RA-5, SR-3, SR-11, IA-5, CM-6, CM-7, SI-2, SI-3
#
# ── THE DESIGN DECISION THAT MATTERS ──────────────────────────────────────────
# Gate on NEW findings, not TOTAL. Gating on the absolute count in any real codebase
# means the pipeline is red forever and everyone learns to ignore it — at which point
# it stops being a control and becomes decoration. The existing backlog is driven down
# on SLA through the POA&M (Critical 7d / High 30d / Medium 90d).
#
# Scanner output is not findings. Every result is dispositioned by the security-engineer
# at G4: true positive / false positive (with a written rationale AND an expiry date) /
# accepted risk (human approval + POA&M entry). A suppression with no rationale is a
# control failure and is reported as one.

name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily rescan. A clean scan at build time says nothing about a CVE published
    # yesterday — this is the control that catches it. (RA-5, SI-2)
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: SAST — CodeQL (SA-11(1))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # ADAPT: your languages.
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # THIRD occurrence of the same defect class in this workflow (L0008): a scanner
      # configured for input that is not present fails on plumbing, and a red gate for a
      # non-finding reason trains people to ignore it. SCA and IaC had it too.
      #
      # The general rule now applied to all three: detect the input, skip LOUDLY when it is
      # absent, and never let "nothing to scan" render as a green pass.
      - name: Any source for ${{ matrix.language }}?
        id: src
        run: |
          case "${{ matrix.language }}" in
            javascript-typescript) pat='-name *.js -o -name *.jsx -o -name *.ts -o -name *.tsx -o -name *.mjs -o -name *.cjs' ;;
            python)                pat='-name *.py' ;;
            go)                    pat='-name *.go' ;;
            java-kotlin)           pat='-name *.java -o -name *.kt' ;;
            csharp)                pat='-name *.cs' ;;
            ruby)                  pat='-name *.rb' ;;
            c-cpp)                 pat='-name *.c -o -name *.cc -o -name *.cpp -o -name *.h' ;;
            *)                     pat='-name *.__none__' ;;
          esac
          # shellcheck disable=SC2086
          if find . -path ./.git -prune -o -path ./node_modules -prune -o \( $pat \) -print 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### SAST SKIPPED — no ${{ matrix.language }} source found"
              echo ""
              echo "**SA-11(1) is NOT satisfied for code in this run — no code was analysed.**"
              echo "This is a scope statement, not a pass. It becomes applicable as soon as"
              echo "source is added. Secret, IaC, and dependency scanning still ran."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        if: steps.src.outputs.present == 'true'
        with:
          language: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/autobuild@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        if: steps.src.outputs.present == 'true'
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        if: steps.src.outputs.present == 'true'
        with:
          category: "/language:${{ matrix.language }}"
      # Results land in the Security tab as SARIF — that file IS the SA-11(1) evidence.
      # Read it. A green badge on a job that scanned nothing is the most common form of
      # false assurance in a pipeline.

  secrets:
    name: Secret scanning (IA-5)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks lists PR commits; without this it 403s and the job
                            # fails for a permissions reason that looks like a scan failure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # full history — a secret deleted in a later commit is still leaked

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Any hit fails. If one fires, the correct response is to ROTATE the credential,
        # then remove it. A deleted commit is not a rotated credential.

  dependencies:
    name: SCA — dependency vulnerabilities (RA-5, SR-3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Same "nothing to scan" case as the IaC job below. A repo with no dependency
      # manifest is legitimate; the scan must say so rather than fail on plumbing or,
      # worse, report green as though it had checked something. (L0008 — this defect
      # existed in BOTH jobs; fixing one was not fixing the class.)
      - name: Any dependency manifests?
        id: deps
        run: |
          if find . -path ./.git -prune -o \
               \( -name 'package.json' -o -name 'package-lock.json' -o -name 'yarn.lock' \
                  -o -name 'requirements*.txt' -o -name 'pyproject.toml' -o -name 'Pipfile.lock' \
                  -o -name 'go.mod' -o -name 'Cargo.toml' -o -name 'Gemfile.lock' \
                  -o -name 'pom.xml' -o -name 'build.gradle*' -o -name 'composer.json' \) \
               -print 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### SCA: no dependency manifests found"
              echo ""
              echo "Nothing to scan. **This is not a pass for RA-5/SR-3** — the control is"
              echo "not yet applicable. It applies the moment you add a manifest."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Scan dependencies
        if: steps.deps.outputs.present == 'true'
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6.5.1
        id: grype
        with:
          path: "."
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload SARIF
        if: always() && steps.grype.outputs.sarif != '' && hashFiles(steps.grype.outputs.sarif) != ''
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: dependency-scan

  iac:
    name: IaC & configuration (CM-6, CM-7)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Is there any IaC to scan? A repo with no Terraform/CloudFormation/K8s/Dockerfile is
      # a legitimate state, and the scan must say "nothing to scan" rather than either
      # failing the gate or — worse — reporting green as though it had checked something.
      - name: Any IaC present?
        id: iac
        run: |
          if find . -path ./.git -prune -o \
               \( -name '*.tf' -o -name '*.tf.json' -o -name 'Dockerfile*' \
                  -o -name 'docker-compose*.y*ml' -o -name '*.template.y*ml' \
                  -o -path '*/k8s/*.y*ml' -o -path '*/helm/*' \) -print 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "### IaC scan: no infrastructure files found" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing to scan. **This is not a pass for CM-6/CM-7** — it means the" >> "$GITHUB_STEP_SUMMARY"
            echo "control is not applicable yet. It becomes applicable the moment you" >> "$GITHUB_STEP_SUMMARY"
            echo "add a Dockerfile or a Terraform module." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkov
        if: steps.iac.outputs.present == 'true'
        id: checkov
        uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # v12.3115.0
        with:
          quiet: true
          soft_fail: true           # gate on the findings below, not on the action's exit
          output_format: sarif
          output_file_path: checkov.sarif

      # DEFECT FIXED 2026-08-07: this ran with `if: always()` against a SARIF that checkov
      # had not produced (nothing to scan), so the UPLOAD failed and the job went red for a
      # reason unrelated to any finding. A gate that fails for plumbing reasons trains people
      # to ignore it — L0007. Upload only when the file exists.
      - name: Upload SARIF
        if: steps.iac.outputs.present == 'true' && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          sarif_file: checkov.sarif
          category: iac-scan

      # The actual gate: fail on High/Critical findings, not on tooling noise.
      - name: Gate on findings
        if: steps.iac.outputs.present == 'true' && hashFiles('checkov.sarif') != ''
        run: |
          # jq, not an inline python heredoc — unindented python inside a YAML block scalar
          # escapes the block and breaks the parse. Caught locally before push.
          n=$(jq '[.runs[]?.results[]?] | length' checkov.sarif 2>/dev/null || echo 0)
          echo "checkov findings: $n"
          [ "$n" -eq 0 ] || { echo "::error::$n IaC misconfiguration(s) — see the Security tab"; exit 1; }

  container:
    name: Container image scan (RA-5, SR-11)
    runs-on: ubuntu-latest
    # ADAPT: enable when you ship containers.
    if: false
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: |
          echo "ADAPT: docker build -t local/app:${{ github.sha }} ."
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/app:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true      # gate on what you can actually act on
      - uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        if: always()
        with:
          sarif_file: trivy.sarif
          category: container-scan

  suppression-audit:
    name: Suppression audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A suppression with no rationale and no expiry is a control failure. Blanket
      # suppressions are how a scanner quietly stops being a control.
      - name: Find suppressions without a rationale or expiry
        run: |
          set +e
          PATTERN='nosec|noqa|eslint-disable|codeql\[|# type: ignore|checkov:skip|trivy:ignore'
          # Scan CODE, not prose. The first run of this job failed against the platform's own
          # documentation, which necessarily quotes these tokens while explaining the rule —
          # docs/, skills, and lesson files all discuss suppressions by name.
          #
          # This is L0007: a checker that fires on documentation about the thing gets muted,
          # and a muted control detects nothing. Same class as L0002. Restrict to source
          # extensions and exclude the directories whose job is to talk about this.
          HITS=$(grep -rInE "$PATTERN" \
                   --include='*.py'  --include='*.js'  --include='*.ts'  --include='*.tsx' \
                   --include='*.jsx' --include='*.go'  --include='*.rs'  --include='*.rb' \
                   --include='*.java' --include='*.cs' --include='*.php' --include='*.sh' \
                   --include='*.tf'  --include='*.yaml' --include='*.yml' \
                   --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=vendor \
                   --exclude-dir=.github --exclude-dir=docs --exclude-dir=.claude \
                   --exclude-dir=platform --exclude-dir=evidence --exclude-dir=scripts . || true)
          if [ -z "$HITS" ]; then echo "No suppressions found."; exit 0; fi

          echo "$HITS" > /tmp/all_suppressions.txt
          # A valid suppression cites an issue (#123) AND an expiry (expires: YYYY-MM-DD).
          BAD=$(grep -vE '#[0-9]+' /tmp/all_suppressions.txt | grep -viE 'expires?:? *[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)

          {
            echo "### Suppression audit"
            echo ""
            echo "Total suppressions: $(wc -l < /tmp/all_suppressions.txt)"
            echo ""
            if [ -n "$BAD" ]; then
              echo "#### ❌ Suppressions missing a rationale (issue ref) and/or an expiry date"
              echo ""
              echo '```'
              echo "$BAD"
              echo '```'
              echo ""
              echo "Every suppression needs an issue reference and an \`expires: YYYY-MM-DD\`."
              echo "Suppressions are reviewed quarterly. An unjustified one fails G4."
            else
              echo "✅ All suppressions carry an issue reference and an expiry date."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ -n "$BAD" ] && exit 1 || exit 0
