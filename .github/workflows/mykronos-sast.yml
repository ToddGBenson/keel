name: Mykronos sast

# ── DISABLED 2026-08-13 — ported to Concourse. Refs: #42 ──────────────────────
# Now the `mykronos-sast` job in ci/pipeline.yml. That job installs the same
# `mykronos` package at the same pinned ref and calls the same
# `python -m mykronos.upload` CLI this file's upload step wraps, so ingestion
# behaviour is unchanged. CodeQL runs from the CLI bundle rather than
# github/codeql-action, which does not exist outside Actions.
#
# ⚠️  THIS EDIT IS AGAINST THE INSTRUCTION AT THE TOP OF THIS FILE ⚠️
# A template resync WILL overwrite this and restore the triggers, at which point
# both this workflow and the Concourse job will scan and ingest. Asked upstream
# for a Concourse target in ToddGBenson/mykronos#13. Until that lands, treat a
# resync of this file as a merge conflict to resolve, not a diff to accept.
on:
  workflow_dispatch:


permissions:
  contents: read

  actions: read
  security-events: read


concurrency:
  group: mykronos-sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: CodeQL (${{ matrix.language }})

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # One language failing to build must not hide findings in the others.
      fail-fast: false
      matrix:
        language: ["python"]


    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:

          # Full history: the adapter reads surrounding source to build the
          # snippet fingerprint that gives a finding stable identity
          # (spec 05 §5).
          fetch-depth: 0


      - name: Fail fast if Mykronos is unreachable
        # spec 05 §4. Better to stop in ten seconds than scan for twenty
        # minutes and find at upload time that the results have nowhere to go
        # — and silently skipping is not an option (spec 01 §6).
        run: |
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer ${{ secrets.MYKRONOS_INGESTION_TOKEN }}" \
            "https://mykronos.toddbenson.net/api/ingest/health" > /dev/null


      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324  # v3.37.7
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@f3712979fa5f215279b101dd0a2e3bdfb4353324  # v3.37.7

      - name: Analyze
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324  # v3.37.7
        with:
          category: "/language:${{ matrix.language }}"
          output: ${{ runner.temp }}/mykronos-results
          # Mykronos is the system of record for findings (spec 05 §1), so we
          # take the SARIF ourselves rather than routing it to code scanning.
          upload: false


      - name: Upload results to Mykronos
        # Shared composite action, semver-pinned: every onboarded repo depends
        # on it, so it must never be referenced by branch (spec 04 §2).
        # `always()` because a scan that failed still has to register its
        # ScanRun — "never ran" and "ran and broke" must stay distinguishable
        # in the lake (spec 04 §6, §7).
        if: always()
        uses: ToddGBenson/mykronos/actions/upload-results@8b329fc5c1f739eab8ad40b8a7628da7cd1ee935
        with:
          capability: sast
          tool: codeql

          results-path: ${{ runner.temp }}/mykronos-results

          ingestion-url: https://mykronos.toddbenson.net
          token: ${{ secrets.MYKRONOS_INGESTION_TOKEN }}
          severity-threshold: low
          blocking: "false"
          # Same ref as the `uses:` line above, resolved when this file was
          # rendered. The action can also fall back to `github.action_ref`, but
          # that is empty inside a composite action, so it is not relied on.
          mykronos-ref: 8b329fc5c1f739eab8ad40b8a7628da7cd1ee935



