# AI evaluation — the test suite for AI behavior.
# Controls: AI RMF MEASURE 2 · 800-53 SA-11, CA-2, CA-7 · AIC-8, AIC-12
#
# ── A PROMPT CHANGE IS A CODE CHANGE ──────────────────────────────────────────
# Teams that treat prompts as configuration ship untested behavior changes to production.
# This workflow triggers on prompt-only diffs, and a regression against baseline blocks the
# merge exactly like a failing unit test.
#
# Also runs on a schedule against production. That is the control that catches the failure
# mode unique to hosted models: the provider updates the model, behavior changes, and there
# is no diff on your side to notice.

name: AI Evaluation

on:
  pull_request:
    paths:
      - '**/prompts/**'
      - '**/evals/**'
      - '**/guardrails/**'
      - '**/*.prompt.*'
      - '**/model_config*'
      # ADAPT: add the paths where your AI feature code lives.
  push:
    branches: [main]
    paths:
      - '**/prompts/**'
      - '**/evals/**'
      - '**/guardrails/**'
  schedule:
    - cron: '0 4 * * 1'   # weekly drift check against production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: Eval suite vs. baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # AIC-8: model, prompt, and eval-set versions are recorded with every run so an
      # assessor can determine exactly what produced a given result.
      - name: Record versions under test
        run: |
          {
            echo "### Versions under test"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Model | ADAPT: pinned model id + version |"
            echo "| Prompt | ADAPT: prompt version/hash |"
            echo "| Eval set | ADAPT: eval-set version |"
            echo "| Grounding source | ADAPT: retrieval corpus version |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run eval suite
        env:
          # Secrets never enter an agent context (AIC-5); CI holds them, scoped to this job.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "ADAPT: run your eval harness, emitting results.json"
          echo ""
          echo "Required categories (docs/12-ai-feature-governance.md):"
          echo "  capability          does the task on a representative set"
          echo "  groundedness        claims supported by source, not confabulated"
          echo "  robustness          holds under paraphrase, typos, adversarial framing"
          echo "  safety              refuses what it should AND does not over-refuse"
          echo "  bias/fairness       quality consistent across demographic slices"
          echo "  injection           does not follow instructions embedded in content"
          echo "  disclosure          no system prompt / other users' data / internals"
          echo "  cost & latency      within the NFR budget under representative load"

      - name: Compare against baseline
        run: |
          echo "ADAPT: compare results.json to the committed baseline."
          echo ""
          echo "ANY regression fails this job and blocks the merge. This is not advisory —"
          echo "an eval regression is a failing test."
          echo ""
          echo "Note over-refusal explicitly: a rising refusal rate on benign requests is a"
          echo "real failure, not a safety improvement. Report both directions."

      - name: Held-out set integrity
        run: |
          echo "ADAPT: assert the eval set was not modified in the same PR as the prompt."
          echo "A prompt tuned against its own eval set measures memorization, not"
          echo "capability, and the resulting number is not evidence."

      - name: Upload eval evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results
          path: |
            **/eval-results/**
            **/results.json
          retention-days: 90
          if-no-files-found: warn

  guardrails:
    name: Guardrail verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify each guardrail BLOCKS
        run: |
          echo "ADAPT: run the guardrail test suite."
          echo ""
          echo "The negative-case rule applies with full force here: each guardrail needs a"
          echo "test proving it BLOCKS. A guardrail verified only on the happy path is"
          echo "unverified, and it will be discovered unverified during an incident."
          echo ""
          echo "Must cover:"
          echo "  - input validation / injection defense at every ingestion channel"
          echo "  - output filtering and validation"
          echo "  - MODEL OUTPUT TREATED AS UNTRUSTED INPUT DOWNSTREAM — never evaled,"
          echo "    exec'd, rendered unescaped, or passed to a privileged operation"
          echo "    unvalidated. This is the SQL-injection lesson relearned and currently"
          echo "    the most under-controlled AI risk in production systems."
          echo "  - tool-call authz against the USER's rights, server-side"
          echo "  - rate and cost limits"
          echo "  - fallback when the model is unavailable or a guardrail trips"

  agent-assurance:
    name: Agent regression (AIC-12)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The agents that build here are a system that can regress. This is the monthly
      # check that they still do their jobs.
      - name: Run the agent regression set
        run: |
          echo "ADAPT: replay past gate decisions against the current agent definitions."
          echo ""
          echo "  - Does the security agent still catch the seeded findings?"
          echo "  - Does the PO agent still reject the untestable acceptance criteria?"
          echo "  - Did any agent attempt an action outside its documented tool grant?"
          echo ""
          echo "Results → evidence/ai-assurance/agent-evals/"
          echo "Regressions are DEFECTS against the agent definitions, fixed through /learn."

      - name: Verify tool grants match the inventory
        run: |
          echo "ADAPT: parse .claude/agents/*.md frontmatter and diff the granted tools"
          echo "against the table in docs/compliance/ai-inventory.md § Section B."
          echo ""
          echo "Drift between the documented grant and the real one is a control failure,"
          echo "and it is easy to introduce accidentally — an agent definition edited to"
          echo "'unblock' a task is the usual cause (AIC-3, AIC-8)."
