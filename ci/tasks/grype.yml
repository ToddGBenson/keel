# SCA — dependency vulnerabilities. Refs: #42
#
# Replaces anchore/scan-action. Grype is installed from its GitHub release with a
# verified checksum; GRYPE_VERSION and GRYPE_SHA256 have no defaults, because a
# vulnerability scanner fetched over the wire without verification is the wrong
# thing to trust. Pin them in ci/vars.yml.
#
# Detects the input and FAILS when it is absent (TheHub #60935): a run with no
# dependency manifest scanned nothing, and a green build that asserts nothing is
# the outcome this lane exists to prevent. It says why, so it is not mistaken
# for a plumbing failure.
platform: linux

# Half the default cpu weight: these containers share one host with production.
# No memory limit: on these cgroup v2 workers one stops the container being
# created at all (mykronos D-174); the worker containers carry the memory cap.
# See ci/README.md, "Container limits"; test/container-limits.test.py holds it.
container_limits:
  cpu: 512

image_resource:
  type: registry-image
  source:
    repository: python
    tag: "3.13"

inputs:
  - name: repo

outputs:
  - name: sca-results

params:
  GRYPE_VERSION: ""
  GRYPE_SHA256: ""
  SEVERITY_CUTOFF: high
  # "true": fail on findings at or above SEVERITY_CUTOFF (the `sca` job).
  # "false": report only, for the `mykronos-sca` upload lane. A grype error
  # still fails. Anything else is refused. See ci/scripts/grype.sh. Refs: #133
  GATE: "true"

run:
  path: bash
  args: [repo/ci/scripts/grype.sh]
