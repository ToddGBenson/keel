# Regression guard for previously fixed hook bypasses. Refs: TheHub #60818
#
# Run by test/hook-bypass-corpus.test.py, which pipes each entry into the REAL hook
# (.claude/hooks/guard-bash.sh or guard-write.sh) as a Claude Code PreToolUse payload,
# in both parser modes (jq, and the sed/python fallback), and fails CI if an entry is
# allowed. Platform-owned (platform/MANIFEST.yml): every fork receives it.
#
# Every entry is a bypass that was found and FIXED (keel#93 / binnacle#14, #115, #117,
# #118, #120, #127, TheHub #61038). keel#93 / binnacle#14 fixed four that both repositories'
# selftest.sh passed straight over; this file makes sure none of them comes back.
# Every entry EXPECTS BLOCK. Must-allow cases (false-positive guards) belong in
# selftest.sh.
#
# ── Fields ───────────────────────────────────────────────────────────────────
#   id        stable; never reuse one
#   hook      guard-bash.sh | guard-write.sh
#   class     one of classes: below
#   source    the issue/PR that fixed it
#   command   guard-bash.sh: the command text (command_parts: a list joined with "")
#   tool      guard-write.sh: Write (default) | Edit | MultiEdit | NotebookEdit
#   file_path, content (or content_parts)   guard-write.sh
#   expect    always block
#   why       what the attempt achieves if it is allowed
#   open_in   OPTIONAL. Parser modes in which an entry is a known, tracked gap: the
#             runner reports it instead of failing, and FAILS once it is blocked, so
#             the fix must delete open_in and the entry becomes a regression test.
#             Never add open_in to make a red run green -- a fixed bypass that is
#             allowed again is a control failure.
#   gap       required with open_in
#
# Credential-shaped values, if ever needed, are split with *_parts so the literal
# never appears contiguously in this file (guard-write.sh and gitleaks would trip).

version: 1

classes:
  api-alternate-route:  "gh api reaches the endpoint a blocked gh subcommand does (keel#93)"
  flag-spelling:        "the same flag spelled another way (keel#93, keel#120)"
  implicit-write:       "gh api writes with a body flag and no method (keel#115)"
  substitution-wrapper: "the command inside $(...), backticks, <(...), bash -c (keel#117)"
  graphql-mutation:     "the blocked action as a GraphQL mutation (keel#118)"
  api-push-to-main:     "moving main through the REST/GraphQL API instead of git push (keel#127)"
  deployment-approval:  "an agent approving an environment deployment, the G5 gate itself (TheHub #61038)"
  curl-route:           "the blocked request sent with curl and the gh token instead of gh api (TheHub #61038)"
  quoted-separator:     "a | ; & or newline inside a quoted argument split the invocation before the rules saw it (TheHub #61038 review)"
  binary-spelling:      "the command named another way: curl.exe, /usr/bin/curl, \\curl, gh.exe (TheHub #61038 review)"
  word-quoting:         "quotes or a backslash inside a word, which bash removes: P\"\"OST, pending\\_deployments, g''h (TheHub #61038 second review)"
  gh-alias:             "a gh alias whose body is a blocked gh command (TheHub #61038 second review)"
  runtime-value:        "the endpoint, method or body supplied at run time: a variable, xargs, $(...) (partly open; TheHub #61039)"
  other-client:         "an HTTP client no rule reads -- wget, httpie, Invoke-RestMethod, a language client (open; TheHub #61039)"

entries:

