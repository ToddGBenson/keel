# keel — Concourse pipeline
#
# Ported from GitHub Actions. Refs: #42
#
# ── WHAT THIS FILE IS ─────────────────────────────────────────────────────────
# The execution half of the lifecycle described in CLAUDE.md. Gates are still
# human acts recorded in GitHub; this pipeline produces the EVIDENCE those gates
# are approved against. It does not approve anything.
#
# ── THE MERGE GATE (TheHub #60849, option C, 2026-10-20) ──────────────────────
# The gate is this pipeline's `Concourse / keel` check run (see the
# check_run_params anchor below). It becomes a required status check on `main`
# once TheHub #60580 lands; until then it lands on main commits only and gates
# nothing. `pr-governance.yml` is RETIRED: Actions cannot start (billing), the
# workflow is disabled, and branch protection requires no checks. What it read
# from the PR body (issue link, AI declaration, DoD, self-review) is
# reviewer-enforced now. There is still no third-party resource type here:
# the check run goes through MyKronos, not a PR resource. See ci/README.md.
#
# ── NO THIRD-PARTY RESOURCE TYPES ─────────────────────────────────────────────
# Every resource below is one Concourse ships with (`git`, `time`,
# `registry-image`, `github-release`). That is deliberate: a pipeline that
# enforces supply-chain controls should not itself pull unpinned community code
# to start up.
#
# ── SETUP ─────────────────────────────────────────────────────────────────────
#   fly -t <target> set-pipeline -p keel \
#       -c ci/pipeline.yml \
#       -l ci/vars.yml            # non-secret, safe to commit as vars.example.yml
#   Secrets come from the credential manager as ((var)) lookups — never a -l file.
#   See ci/README.md.

# ══════════════════════════════════════════════════════════════════════════════
# Anchors
# ══════════════════════════════════════════════════════════════════════════════

# Every Mykronos lane fails fast when the ingestion API is unreachable. Better to
# stop in ten seconds than scan for twenty minutes and find at upload time that
# the results have nowhere to go — and silently skipping is not an option.
mykronos_preflight: &mykronos_preflight
  task: mykronos-preflight
  file: repo/ci/tasks/mykronos-preflight.yml
  params:
    MYKRONOS_INGESTION_URL: ((mykronos_ingestion_url))
    MYKRONOS_INGESTION_TOKEN: ((mykronos_ingestion_token))

# Shared uploader. This is a port of the `upload-results` composite action, which
# is itself a thin wrapper around `python -m mykronos.upload` — so the pipeline
# calls the same CLI, from the same package, pinned at the same ref. The
# normalization logic and the FindingSubmission schema keep exactly one
# definition, which was the point of that action existing.
mykronos_upload_params: &mykronos_upload_params
  MYKRONOS_INGESTION_URL: ((mykronos_ingestion_url))
  MYKRONOS_INGESTION_TOKEN: ((mykronos_ingestion_token))
  MYKRONOS_REF: ((mykronos_ref))
  REPO_SLUG: ((github_owner))/((github_repo))
  SEVERITY_THRESHOLD: low
  BLOCKING: "false"

# `Concourse / keel`: this commit's verdict, on GitHub. Refs: #107
#
# A job reports its start or end to MyKronos, and MyKronos posts one GitHub check
# run per commit through its own GitHub App (MyKronos D-136, TheHub #60580). This
# pipeline holds no GitHub credential for it; the ingestion token is the one the
# MyKronos lanes already use.
#
# The commit chain is what it reports on, because it is the one path in this file
# whose end means "every step before it passed on this commit":
#
#   build   ┐
#   lint    │
#   test    │
#   sast    ├→ build-and-attest → verify-artifact
#   secrets │
#   sca     │
#   iac     ┘
#
# `build` reports the start. `verify-artifact` reports success as its LAST step.
# Every job in the chain reports failure from `on_failure:` and `on_error:`, so a
# red lane is a red check and not a check left in progress.
#
# THE SCANNERS ARE IN THE VERDICT since TheHub #60850 (2026-10-20). Until then
# the chain ran through `full-suite`, an `echo "ADAPT: ..."` stub that exited 0,
# so build-and-attest waited on build/lint/test and on nothing that scanned.
# `build-and-attest` is now the gather: its `passed:` names every verifying lane,
# so `verify-artifact` can only report success for a version that passed all of
# them. That answers the objection D-151 recorded against wiring the scanners
# in ("the colour would depend on which job finished last"): a scanner can only
# report failure, and success needs every one of them green on the same commit.
# The cost is latency: the verdict now waits on `sca` and the serial CodeQL
# `sast`, which took 12-22 minutes on push builds in October 2026.
#
# Still NOT in the verdict: `suppression-audit` and `platform-integrity` (they
# audit the repository's process, not the commit's code), and the Mykronos
# ingestion lanes (they report; they do not decide).
#
# MAIN COMMITS ONLY. `repo` tracks main, and verification runs after the merge
# (POAM-014), so a pull request never carries this check. Requiring it on `main`
# would block every pull request. See ci/README.md, "Concourse / keel".
#
# No `attempts:`: this can fail, and a retried step cannot tell "could not ask"
# from "asked and was refused". The retry is inside curl.
check_run_params: &check_run_params
  MYKRONOS_INGESTION_URL: ((mykronos_ingestion_url))
  MYKRONOS_INGESTION_TOKEN: ((mykronos_ingestion_token))
  REPO_SLUG: ((github_owner))/((github_repo))

# ══════════════════════════════════════════════════════════════════════════════
# Resource types — none. See the header.
# ══════════════════════════════════════════════════════════════════════════════

resources:

  - name: repo
    type: git
    icon: git
    check_every: 1m
    webhook_token: ((webhook_token))
    source:
      # SSH with a READ-ONLY DEPLOY KEY, not HTTPS with a token.
      #
      # The repository went private, and the git resource then failed with
      # `could not read Username for 'https://github.com'` — which took the whole
      # pipeline down, because every job gets this resource. A personal access
      # token would have fixed it and would have put a credential that can write
      # to every repository the owner has into a pipeline that needs to read one.
      #
      # A deploy key is scoped to this repository and marked read_only, so the
      # worst case is disclosure of source Concourse already checks out.
      uri: ((git_uri))
      branch: main
      private_key: ((git_private_key))
      # Full history. Two independent reasons: the Mykronos adapters read
      # surrounding source to build the snippet fingerprint that gives a finding
      # stable identity, and a secret deleted in a later commit is still leaked.
      fetch_tags: true

  # ── Schedules ───────────────────────────────────────────────────────────────
  # Concourse's bundled `time` resource has no cron syntax and no day-of-month
  # support.
  #
  # ── WHY `interval` AND NOT `start`/`stop` ─────────────────────────────────────
  # The first version of this pipeline used time windows, because they look like
  # the crons they replaced: `start: 6:00 AM, stop: 6:30 AM`. That was wrong, and
  # only running it showed why.
  #
  # A window-only `time` resource emits NO version until its window next opens.
  # Every job that `get`s one is unrunnable until then — not by trigger, and not
  # manually either. The build sits `pending`, which in the UI reads as "queued"
  # rather than "cannot run".
  #
  # Setting the pipeline at 08:00 UTC therefore left `secrets`, `sast`, `sca` and
  # `iac` dark until 06:00 the following day, and the Mykronos, AI and compliance
  # lanes dark until the following Monday. Nothing failed. The pipeline looked
  # healthy while most of its security scanning had never run once — which is the
  # exact false-assurance shape L0007 and L0008 describe.
  #
  # `interval` emits a version on the first check, so every lane is live the
  # moment the pipeline is set. The cost is that run time drifts instead of
  # landing at a fixed hour. For a rescan, a predictable hour is not a property
  # worth having a dark pipeline for.
  #
  # ── THE PARAGRAPH ABOVE IS STILL TRUE AND IS NO LONGER THE WHOLE STORY ──────
  # [#60496] "Two resources rather than five: the original crons were staggered
  # across 03:00–06:00 to spread load on GitHub's runners, which is not a
  # constraint here." The premise was that nothing downstream cared when these
  # ran together. Measured 2026-09-11 against the live server, something does.
  #
  # `get: daily` appeared TEN times, every one with `trigger: true`. One version
  # of one resource lands and all ten jobs schedule in the same instant onto a
  # TWO-worker Concourse. On 2026-09-10 that produced:
  #
  #     run check: find or create container on worker worker-2:
  #     iptables: bulk-prepend-rules: Can't lock /run/xtables.lock:
  #     Resource temporarily unavailable
  #
  # Nine of the ten survived; `sca` lost the lock and ERRORED. Over the last 300
  # builds (measured 2026-09-24): 141 succeeded, 119 errored, 39 failed. Errored
  # outrunning failed three to one is not what a healthy estate looks like, and
  # this is the one cause identified by name. #59083's retry sweep now recovers
  # such a lane within 30 minutes, which is a real improvement and is also the
  # sweep spending its budget on self-inflicted contention.
  #
  # So the load the original crons were spreading was never GitHub's. It was the
  # worker's, and it followed the pipeline here.
  #
  # ── WHY WINDOWS, GIVEN THE WARNING DIRECTLY ABOVE ───────────────────────────
  # That warning is accurate and its cost is smaller than it reads. A windowed
  # resource emits no version until its window next opens, so after a
  # `set-pipeline` these lanes are late ONCE, by at most the time to the next
  # window — under 24 hours for a daily window. What made the original incident
  # serious was the WEEKLY lanes, dark until the following Monday, and `weekly`
  # below is deliberately left on `interval` for exactly that reason.
  #
  # The steady state is proven rather than assumed: thehub's pipeline on this
  # same server has run its `daily` on `start: 2:00 AM / stop: 3:00 AM` for
  # months.
  #
  # AFTER APPLYING THIS, trigger the daily lanes once by hand instead of waiting
  # — a lane that is merely late looks exactly like a lane that is broken, which
  # is the failure this repository keeps paying for.
  #
  # ── THE WAVES ───────────────────────────────────────────────────────────────
  # Named for the hour they fire, so the schedule is readable from the resource
  # name and a job's wave is visible where it is `get`. Four waves rather than
  # two because the pool is two workers: three concurrent starts is a queue, ten
  # is a stampede. The two heaviest scanners, `sast` and `sca`, are deliberately
  # in different waves.
  #
  #   03:00  build, lint, test                 the commit chain, cheap
  #   04:00  sast, secrets
  #   05:00  sca, iac
  #   06:00  suppression-audit, platform-integrity

  - name: daily-0300
    type: time
    icon: clock-outline
    source:
      location: ((scan_timezone))
      start: "3:00 AM"
      stop: "3:30 AM"

  - name: daily-0400
    type: time
    icon: clock-outline
    source:
      location: ((scan_timezone))
      start: "4:00 AM"
      stop: "4:30 AM"

  - name: daily-0500
    type: time
    icon: clock-outline
    source:
      location: ((scan_timezone))
      start: "5:00 AM"
      stop: "5:30 AM"

  - name: daily-0600
    type: time
    icon: clock-outline
    source:
      location: ((scan_timezone))
      start: "6:00 AM"
      stop: "6:30 AM"

  - name: weekly
    type: time
    icon: clock-outline
    source: { interval: 168h }

# ══════════════════════════════════════════════════════════════════════════════
# Groups — the UI is a navigation surface, not decoration. A pipeline nobody can
# read is a pipeline nobody notices going red.
# ══════════════════════════════════════════════════════════════════════════════

groups:
  # ── HOW THESE ARE ORGANISED ─────────────────────────────────────────────────
  # Concourse renders each group as its own DAG, and the first group is the
  # default view. So groups are not labels — they decide what a person sees when
  # they open this pipeline, and whether the arrows between jobs are visible.
  #
  # The previous grouping was by SUBJECT (ci / supply-chain / security), which cut
  # the one genuinely traceable path in this pipeline in half: build, lint and
  # test sat in `ci` while the jobs they feed — build-and-attest, verify-artifact
  # — sat in `supply-chain`. The `passed:` arrows between them existed and were
  # invisible in both views, so the pipeline read as a field of unrelated boxes.
  #
  # Now: `commit` is first and contains the whole chain, so the default view is
  # "what happens to my push", drawn as a chain. Every other group answers one
  # question. Jobs appear in more than one group on purpose — a job belongs to
  # every question it answers.

  # What happens to a commit, end to end. This is the only group with `passed:`
  # arrows running all the way through, so it is the one that draws a line.
  #   set-pipeline
  #   build, lint, test, sast, secrets, sca, iac → build-and-attest → verify-artifact
  - name: commit
    jobs:
      - set-pipeline
      - build
      - lint
      - test
      - sast
      - secrets
      - sca
      - iac
      - build-and-attest
      - verify-artifact

  # What scans, and what blocks. `sast` is the only job in this pipeline that
  # fails a build on a finding; the rest report. container-scan is inert until
  # this repository ships an image.
  - name: security
    jobs: [sast, secrets, sca, iac, suppression-audit, container-scan]

  # Is the platform still the platform — agent tool grants against the inventory,
  # skills registered, evidence integrity — plus the monitoring cadence that
  # produces the evidence an assessor reads.
  - name: governance
    jobs:
      - platform-integrity
      - suppression-audit
      - compliance-monthly

  # The agents are a system that can regress.
  - name: ai
    jobs: [agent-assurance]

  # Ingestion to the system of record. RUNNING since 2026-09-08. Grouped
  # separately so the lane is obvious rather than a grey box in the middle of
  # something else.
  #
  # This said "PAUSED — no ingestion token" until 2026-09-12. All three jobs
  # were running the whole time: a token was issued 2026-09-01, the lanes
  # failed with HTTP 401 "Ingestion token is unknown, revoked, or expired"
  # until 00:53 on 2026-09-08, and have succeeded since 20:07 that evening.
  # Concourse reports none of them paused.
  #
  # A comment that says a security lane is off when it is on is the inverse of
  # the usual hazard and costs the same: somebody debugging missing keel
  # coverage reads "no token", stops, and never looks at the 401.
  - name: mykronos
    jobs: [mykronos-sast, mykronos-secrets, mykronos-sca, mykronos-atlas]

  # What runs when nobody pushes. Worth its own view: after an outage or a
  # holiday, this is the list you check, and hunting for it across five
  # subject-based tabs is how a silent cadence stays silent.
  - name: scheduled
    jobs:
      - agent-assurance
      - compliance-monthly

  - name: all
    jobs: ["*"]

# ══════════════════════════════════════════════════════════════════════════════
# Jobs
# ══════════════════════════════════════════════════════════════════════════════

jobs:

  # ── THE PIPELINE UPDATES ITSELF ─────────────────────────────────────────────
  # Without this, every change to ci/pipeline.yml needs someone to remember
  # `fly set-pipeline`, and the running pipeline silently drifts from the one in
  # git. That drift is invisible: the UI shows a pipeline, and nothing says it is
  # three commits behind the file that is supposed to define it.
  #
  # `set_pipeline: self` closes it — main is the definition, and Concourse
  # applies it. This job is first in the file because it is what makes every
  # other job in it trustworthy.
  #
  # ── THE TRAP: THIS JOB REVERTS BRANCH EXPERIMENTS ───────────────────────────
  # `set_pipeline: self` applies ci/pipeline.yml FROM THE REPO INPUT, and that
  # file pins `branch: main`. So applying a branch's pipeline by hand
  # (`sed s/branch: main/branch: my-branch/`) survives only until this job next
  # runs — it then rewrites the pipeline back to main's copy.
  #
  # That bit hard once: the fix for a broken git resource lived on a branch, this
  # job reverted the pipeline to main's broken version, and the repo resource
  # stopped authenticating — so nothing could run, including this job, which is
  # what stopped the revert loop rather than any deliberate design.
  #
  # Main IS the definition; that is the point, not a defect. To try a pipeline
  # change on a branch, either set it under a DIFFERENT pipeline name, or pause
  # this job for the duration. Do not expect a hand-applied branch config to
  # stick.
  #
  # var_files points at vars.example.yml deliberately: that file holds this
  # repository's real NON-SECRET configuration (tool pins, URLs, versions), and
  # every actual secret is a ((var)) resolved from Vault at build time. A fork
  # changes the values there. Nothing sensitive is committed, which is the whole
  # reason a credential manager exists.
  - name: set-pipeline
    public: true
    plan:
      - get: repo
        trigger: true
      - set_pipeline: self
        file: repo/ci/pipeline.yml
        var_files: [repo/ci/vars.example.yml]

  # ── PREMISE CHANGED 2026-08-13: THESE ARE NOW THE ONLY VERIFICATION ─────────
  # These lanes were moved to a daily cadence because re-running a deterministic
  # check on main re-answered a question the pull request had already answered
  # (L0015). That reasoning depended on the pull request actually running them.
  #
  # It no longer does. The repository is private, GitHub Actions cannot run
  # (billing), and every required status check has been removed so that anything
  # can merge at all. There is no prevention layer left — so post-merge detection
  # is not a duplicate of anything, it is the whole of it.
  #
  # Per-commit triggers are restored for exactly that reason. A daily cadence
  # would leave up to 24 hours of unverified main, which was acceptable when a PR
  # gate stood in front of it and is not acceptable now.
  #
  # If Actions ever run again, revert this hunk: the duplication argument becomes
  # correct again the moment something blocks a merge.

  # ── CI ──────────────────────────────────────────────────────────────────────
  # Target: feedback under 10 minutes. Slow pipelines get bypassed, and a
  # bypassed control is worse than an honest absence of one because it still
  # shows green on the assessment.

  - name: build
    public: true
    on_failure:
      task: check-run
      file: repo/ci/tasks/check-run.yml
      # Three attempts of 45s plus two 5s delays is 145s; 5m is twice that.
      timeout: 5m
      params: { <<: *check_run_params, JOB: build, PHASE: end, CONCLUSION: failure }
    on_error:
      task: check-run
      file: repo/ci/tasks/check-run.yml
      # Three attempts of 45s plus two 5s delays is 145s; 5m is twice that.
      timeout: 5m
      params: { <<: *check_run_params, JOB: build, PHASE: end, CONCLUSION: failure }
    plan:
      - get: repo
        trigger: true
      - get: daily-0300
        trigger: true
      # `Concourse / keel` goes in_progress on this commit. On the daily re-run
      # of a commit that already has a verdict, MyKronos leaves the verdict
      # alone (a start never reopens one).
      - task: check-run
        file: repo/ci/tasks/check-run.yml
        timeout: 5m
        params: { <<: *check_run_params, JOB: build, PHASE: start }
      - task: build
        file: repo/ci/tasks/ci-stage.yml
        params: { STAGE: build }

  - name: lint
    public: true
    on_failure:
      task: check-run
      file: repo/ci/tasks/check-run.yml
      # Three attempts of 45s plus two 5s delays is 145s; 5m is twice that.
      timeout: 5m
      params: { <<: *check_run_params, JOB: lint, PHASE: end, CONCLUSION: failure }
    on_error:
      task: check-run
      file: repo/ci/tasks/check-run.yml
      # Three attempts of 45s plus two 5s delays is 145s; 5m is twice that.
      timeout: 5m
      params: { <<: *check_run_params, JOB: lint, PHASE: end, CONCLUSION: failure }
    plan:
      - get: repo
        trigger: true
      - get: daily-0300
        trigger: true
      # Separate task because shellcheck ships its own Alpine image and the rest
      # of the lint stage needs Python. Its report is an input to the stage
      # below, which fails if it is missing — so the linter cannot be skipped
      # silently.
      - task: shellcheck
        file: repo/ci/tasks/shellcheck.yml
        # ── ITS RESULTS REACH MYKRONOS (#105, B-051) ──────────────────────────
        # Shell is most of this repository and CodeQL reads none of it, so
        # MyKronos measured keel ~70% unread by any analyser while this task ran
        # on every push and uploaded nothing. Same uploader, same pin, as every
        # other lane; `sast` because this is a second analyser on that
        # capability, not a capability of its own.
        #
        # `ensure:`, not a following step: the gate fails this task on a
        # warning, and a sibling upload would be skipped exactly when there was
        # most to report.
        #
        # No `*mykronos_preflight` here, deliberately. Preflight exists so a
        # twenty-minute scan does not discover at the end that its results have
        # nowhere to go; ShellCheck takes seconds, and a preflight first would
        # make an unreachable MyKronos stop the lint gate from running at all.
        # An unreachable MyKronos still turns this job red, at the upload.
        #
        # TRIGGERED_BY is unset for the reason given on `iac`: this job fires on
        # both `repo` and `daily-0300`.
        ensure:
          task: upload-shellcheck
          file: repo/ci/tasks/mykronos-upload.yml
          params:
            <<: *mykronos_upload_params
            CAPABILITY: sast
            TOOL: shellcheck
            # The tag ci/tasks/shellcheck.yml pins. Two places, one value.
            TOOL_VERSION: "0.10.0"
      - task: lint
        file: repo/ci/tasks/ci-stage.yml
        params: { STAGE: lint }

  - name: test
    public: true
    on_failure:
      task: check-run
      file: repo/ci/tasks/check-run.yml
      # Three attempts of 45s plus two 5s delays is 145s; 5m is twice that.
      timeout: 5m
      params: { <<: *check_run_params, JOB: test, PHASE: end, CONCLUSION: failure }
    on_error:
      task: check-run
      file: repo/ci/tasks/check-run.yml
      # Three attempts of 45s plus two 5s delays is 145s; 5m is twice that.
      timeout: 5m
      params: { <<: *check_run_params, JOB: test, PHASE: end, CONCLUSION: failure }
    plan:
      - get: repo
        trigger: true
      - get: daily-0300
        trigger: true
      # No COVERAGE_THRESHOLD (TheHub #60850). It was "80" and nothing measured
      # against it: the coverage step echoed "ADAPT: assert coverage >= 80%" and
      # exited 0. keel has no application code to cover. A fork that has some
      # adds a real coverage gate and its threshold together, in one change.
      - task: test
        file: repo/ci/tasks/ci-stage.yml
        params: { STAGE: test }

  # ── NO `full-suite` JOB (TheHub #60850, 2026-10-20) ──────────────────────────
  # It ran `STAGE=full-suite`, which echoed "ADAPT: every test, including the
  # slow ones" and exited 0, and it sat in the middle of the commit chain, so a
  # green `Concourse / keel` passed through a job that verified nothing. keel has
  # no slow suite. The stage stays in ci/scripts/ci-stage.sh as TEMPLATE for a
  # fork that has one, and it now fails until it is adapted. See ci/README.md,
  # "Template lanes keel does not run".

  # ── Security ────────────────────────────────────────────────────────────────
  # Gate on NEW findings, not TOTAL. Gating on the absolute count in any real
  # codebase means the pipeline is red forever and everyone learns to ignore it —
  # at which point it stops being a control and becomes decoration. The existing
  # backlog is driven down on SLA through the POA&M.

  # ── SAST ────────────────────────────────────────────────────────────────────
  # RESTORED 2026-08-13, and it gates.
  #
  # This job was deleted when mykronos-sast was made to cover both languages —
  # correct at the time, because the Mykronos lane ingested findings to the system
  # of record and this one discarded them. Then the Mykronos lanes were paused for
  # want of an ingestion token, and the result was NO SAST ANYWHERE. A deletion
  # justified by a replacement, where the replacement then stopped running.
  #
  # It gates on security findings at severity >= medium, unlike the Mykronos lane,
  # because nothing else gates anything now: Actions cannot run and every required
  # status check has been removed (POAM-014). Quality findings do not gate — that
  # would turn security-and-quality into a style gate and the lane would be
  # switched off within a week.
  - name: sast
    public: true
    # serial: an 846MB CodeQL bundle is downloaded per language per run, so two
    # concurrent builds is 3.4GB on one worker and three is five. Three stacked
    # up during testing and none of them finished — they were not deadlocked,
    # just starving each other. A job this expensive must not run against itself.
    serial: true
    on_failure:
      task: check-run
      file: repo/ci/tasks/check-run.yml
      # Three attempts of 45s plus two 5s delays is 145s; 5m is twice that.
      timeout: 5m
      params: { <<: *check_run_params, JOB: sast, PHASE: end, CONCLUSION: failure }
    on_error:
      task: check-run
      file: repo/ci/tasks/check-run.yml
      # Three attempts of 45s plus two 5s delays is 145s; 5m is twice that.
      timeout: 5m
      params: { <<: *check_run_params, JOB: sast, PHASE: end, CONCLUSION: failure }
    plan:
      - get: repo
        trigger: true
      - get: daily-0400
        trigger: true
      - in_parallel:
          - task: codeql-python
            file: repo/ci/tasks/codeql.yml
            output_mapping: { mykronos-results: results-python }
            params:
              CODEQL_LANGUAGE: python
              CODEQL_QUERIES: security-extended,security-and-quality
              CODEQL_BUNDLE_VERSION: ((codeql_bundle_version))
              CODEQL_BUNDLE_SHA256: ((codeql_bundle_sha256))
              FAIL_ON_SECURITY_FINDING: "true"
          - task: codeql-javascript
            file: repo/ci/tasks/codeql.yml
            output_mapping: { mykronos-results: results-javascript }
            params:
              CODEQL_LANGUAGE: javascript-typescript
              CODEQL_QUERIES: security-extended,security-and-quality
              CODEQL_BUNDLE_VERSION: ((codeql_bundle_version))
              CODEQL_BUNDLE_SHA256: ((codeql_bundle_sha256))
              FAIL_ON_SECURITY_FINDING: "true"

  # ── DAILY, NOT PER-COMMIT ───────────────────────────────────────────────────
  # `main` cannot be reached except through a pull request that already ran
  # gitleaks (enforce_admins on, no force-push, 12 required checks). Re-running
  # it on every merge re-answers a question the PR already answered.
  #
  # What it is FOR is detection: a secret that arrives by a route prevention did
  # not cover — two PRs green in isolation, a protection setting changed, a merge
  # that resolved badly. Detection wants a cadence. This one still blocks, which
  # is the difference between it and the ingestion lane below.
  - name: secrets
    public: true
    on_failure:
      task: check-run
      file: repo/ci/tasks/check-run.yml
      # Three attempts of 45s plus two 5s delays is 145s; 5m is twice that.
      timeout: 5m
      params: { <<: *check_run_params, JOB: secrets, PHASE: end, CONCLUSION: failure }
    on_error:
      task: check-run
      file: repo/ci/tasks/check-run.yml
      # Three attempts of 45s plus two 5s delays is 145s; 5m is twice that.
      timeout: 5m
      params: { <<: *check_run_params, JOB: secrets, PHASE: end, CONCLUSION: failure }
    plan:
      - get: repo
        trigger: true
      - get: daily-0400
        trigger: true
      - task: gitleaks
        file: repo/ci/tasks/gitleaks.yml
      # Any hit fails. If one fires, the correct response is to ROTATE the
      # credential, then remove it. A deleted commit is not a rotated credential.
      - task: gate
        file: repo/ci/tasks/gitleaks-gate.yml

  - name: sca
    public: true
    on_failure:
      task: check-run
      file: repo/ci/tasks/check-run.yml
      # Three attempts of 45s plus two 5s delays is 145s; 5m is twice that.
      timeout: 5m
      params: { <<: *check_run_params, JOB: sca, PHASE: end, CONCLUSION: failure }
    on_error:
      task: check-run
      file: repo/ci/tasks/check-run.yml
      # Three attempts of 45s plus two 5s delays is 145s; 5m is twice that.
      timeout: 5m
      params: { <<: *check_run_params, JOB: sca, PHASE: end, CONCLUSION: failure }
    plan:
      - get: repo
        trigger: true
      - get: daily-0500
        trigger: true
      - task: grype
        file: repo/ci/tasks/grype.yml
        params:
          GRYPE_VERSION: ((grype_version))
          GRYPE_SHA256: ((grype_sha256))
          SEVERITY_CUTOFF: high

  # This lane reached NOTHING until 2026-09-24. [#59989/#60071]
  #
  # It ran, it decided correctly that this repository has no IaC to scan, it
  # printed a paragraph saying the control is not applicable, and then it exited
  # 0 into a build log nobody reads. The platform holds an `iac` grant for this
  # repo and had never received a single run against it, so every surface that
  # asks "is IaC covered here" was answering from absence.
  #
  # Now it uploads, and checkov.sh writes a SARIF carrying
  # `properties.mykronos.scanStatus = no_applicable_targets` — a status the
  # platform already had, already treated as a reporting outcome and already
  # excluded from alerting, and which nothing could reach from a SARIF tool
  # until the adapter learned to read the property bag.
  #
  # The upload is on `ensure:` for the same reason as every other lane here: a
  # scan that fails must still be visible as a scan that failed, not as a gap.
  # That matters more here than elsewhere, because when this repo DOES gain a
  # Dockerfile, checkov.sh starts exiting 1 on findings — and those findings are
  # exactly what must reach the lake.
  #
  # TRIGGERED_BY is deliberately unset. The upload task documents it as
  # "set it explicitly on a job whose trigger is unambiguous", and this job
  # triggers on both `repo` and `daily`. Guessing `schedule` here would be a
  # fabricated attribution on every push-triggered run.
  - name: iac
    public: true
    on_failure:
      task: check-run
      file: repo/ci/tasks/check-run.yml
      # Three attempts of 45s plus two 5s delays is 145s; 5m is twice that.
      timeout: 5m
      params: { <<: *check_run_params, JOB: iac, PHASE: end, CONCLUSION: failure }
    on_error:
      task: check-run
      file: repo/ci/tasks/check-run.yml
      # Three attempts of 45s plus two 5s delays is 145s; 5m is twice that.
      timeout: 5m
      params: { <<: *check_run_params, JOB: iac, PHASE: end, CONCLUSION: failure }
    plan:
      - get: repo
        trigger: true
      - get: daily-0500
        trigger: true
      - do:
          - *mykronos_preflight
          - task: checkov
            file: repo/ci/tasks/checkov.yml
            params:
              CHECKOV_VERSION: ((checkov_version))
        ensure:
          task: upload
          file: repo/ci/tasks/mykronos-upload.yml
          input_mapping: { mykronos-results: iac-results }
          params:
            <<: *mykronos_upload_params
            CAPABILITY: iac
            TOOL: checkov
            TOOL_VERSION: ((checkov_version))

  # ADAPT: enable when you ship containers. Left with no trigger rather than
  # deleted — the original carried `if: false` for the same reason, and a job
  # that is visibly not running beats one that silently does not exist.
  #
  # Started by hand with no IMAGE_REF it goes RED, by decision (TheHub #60935,
  # the rule `iac` and `sca` follow): a scan of nothing is not a pass. It stays
  # out of the `commit` chain and has no trigger, so that red never reaches
  # `Concourse / keel`; it only stops the lane reading green while unused.
  - name: container-scan
    public: true
    plan:
      - get: repo
      - task: trivy
        file: repo/ci/tasks/trivy.yml
        params:
          TRIVY_VERSION: ((trivy_version))
          TRIVY_SHA256: ((trivy_sha256))

  - name: suppression-audit
    public: true
    plan:
      - get: repo
        trigger: true
      - get: daily-0600
        trigger: true
      - task: suppression-audit
        file: repo/ci/tasks/suppression-audit.yml

  # ── Mykronos ────────────────────────────────────────────────────────────────
  # Findings are recorded in Mykronos, which is the system of record. Each lane
  # registers a ScanRun even when the scan itself broke, so "never ran" and "ran
  # and broke" stay distinguishable in the lake.

  - name: mykronos-sast
    public: true
    serial: true
    plan:
      - get: repo
        trigger: true
      - get: weekly
        trigger: true
      # BOTH languages, in one lane. There used to be a second `sast` job running
      # CodeQL over javascript-typescript and then throwing the SARIF away
      # (POAM-012) — a duplicate analysis whose results reached nothing. This is
      # now the only SAST on main, and it ingests every language to the system of
      # record. Deleting the other job closed POAM-012 rather than tracking it.
      #
      # output_mapping/input_mapping keep the two runs' results apart: the task
      # always writes `mykronos-results`, so each is renamed on the way out and
      # renamed back for its own upload.
      - do:
          - *mykronos_preflight
          - task: codeql-python
            file: repo/ci/tasks/codeql.yml
            output_mapping: { mykronos-results: results-python }
            params:
              CODEQL_LANGUAGE: python
              CODEQL_QUERIES: security-extended
              CODEQL_BUNDLE_VERSION: ((codeql_bundle_version))
              CODEQL_BUNDLE_SHA256: ((codeql_bundle_sha256))
              UPLOAD_TO_MYKRONOS: "true"
          - task: codeql-javascript
            file: repo/ci/tasks/codeql.yml
            output_mapping: { mykronos-results: results-javascript }
            params:
              CODEQL_LANGUAGE: javascript-typescript
              CODEQL_QUERIES: security-extended
              CODEQL_BUNDLE_VERSION: ((codeql_bundle_version))
              CODEQL_BUNDLE_SHA256: ((codeql_bundle_sha256))
              UPLOAD_TO_MYKRONOS: "true"
        ensure:
          do:
            - task: upload-python
              file: repo/ci/tasks/mykronos-upload.yml
              input_mapping: { mykronos-results: results-python }
              params:
                <<: *mykronos_upload_params
                CAPABILITY: sast
                TOOL: codeql
                TRIGGERED_BY: schedule
              ensure:
                task: upload-javascript
                file: repo/ci/tasks/mykronos-upload.yml
                input_mapping: { mykronos-results: results-javascript }
                params:
                  <<: *mykronos_upload_params
                  CAPABILITY: sast
                  TOOL: codeql
                  TRIGGERED_BY: schedule

  - name: mykronos-secrets
    public: true
    plan:
      - get: repo
        trigger: true
      - get: weekly
        trigger: true
      - do:
          - *mykronos_preflight
          # Never fails the step itself: exit codes are the upload step's job,
          # which applies this repo's configured threshold and blocking policy.
          # A scanner deciding CI outcomes on its own bypasses that.
          - task: gitleaks
            file: repo/ci/tasks/gitleaks.yml
        ensure:
          task: upload
          file: repo/ci/tasks/mykronos-upload.yml
          params:
            <<: *mykronos_upload_params
            CAPABILITY: secrets
            TOOL: gitleaks
            TRIGGERED_BY: schedule

  # grype's findings, to the system of record. Refs: #133, mykronos#414
  #
  # `sca` runs grype, gates on `high`, and until this lane existed its findings
  # went nowhere except the build artifacts. That was harmless while keel had no
  # manifest. ci/requirements.txt arrived 2026-09-17, so grype now scans something
  # and gates on it. The `sca` job is unchanged and still the gate. This lane runs
  # the same task with GATE=false, so findings reach the uploader rather than
  # failing the step, and a grype error still fails it.
  #
  # Uploaded as `atlas/grype`, beside osv-scanner. osv-scanner reads manifests;
  # grype reads more, which is why a second tool is worth having.
  #
  # NEEDS MyKronos `AdapterSpec("atlas", "grype", ...)` AND a `mykronos_ref` that
  # includes it. At f8d8cfd (and mykronos main as of 2026-10-17) the upload fails
  # with "No adapter for capability 'atlas' with tool 'grype'".
  #
  # A SECOND LANE ON ONE CAPABILITY (mykronos#380). The platform takes the newest
  # scan per (repo, capability), so if either this lane or `mykronos-atlas` stops,
  # the other keeps `atlas` looking fresh. Both run on the same triggers, so
  # neither routinely outlives the other, but it is a mask, not a fix.
  #
  # TRIGGERED_BY is unset for the reason given on `iac`: this job triggers on
  # both `repo` and `weekly`, and `schedule` would be wrong on every push run.
  - name: mykronos-sca
    public: true
    plan:
      - get: repo
        trigger: true
      - get: weekly
        trigger: true
      - do:
          - *mykronos_preflight
          - task: grype
            file: repo/ci/tasks/grype.yml
            params:
              GRYPE_VERSION: ((grype_version))
              GRYPE_SHA256: ((grype_sha256))
              SEVERITY_CUTOFF: high
              GATE: "false"
        ensure:
          task: upload
          file: repo/ci/tasks/mykronos-upload.yml
          input_mapping: { mykronos-results: sca-results }
          params:
            <<: *mykronos_upload_params
            CAPABILITY: atlas
            TOOL: grype
            TOOL_VERSION: ((grype_version))

  - name: mykronos-atlas
    public: true
    serial: true
    plan:
      - get: repo
        trigger: true
      # `github-release` removed 2026-08-14. It resolved to
      #   GET /repos/ToddGBenson/keel/releases -> 404 Not Found
      # because the repository is private and ((github_token)) is empty, and an
      # unauthenticated call to a private repo returns 404 rather than 401. The
      # failing resource check left this whole lane PENDING — not failed, just
      # never scheduled, which is the least visible way for a lane to stop.
      #
      # It bought one thing: stamping `tag_or_release` on Atlas evidence when a
      # build sits at a release commit. This repository has never cut a release,
      # so the resource was blocking a lane in exchange for a field that has
      # always been empty. atlas-evidence already treats it as optional and omits
      # the tag when absent.
      #
      # To restore: put a read-only token in ((github_token)) and add the get
      # back. Do not add it back without the token.
      - get: weekly
        trigger: true
      - do:
          - *mykronos_preflight
          - task: osv-scan
            file: repo/ci/tasks/osv-scan.yml
          # CycloneDX, fixed. The Actions template had a format switch, but it
          # rendered to a hardcoded "cyclonedx" for this repo and the other
          # branch had never executed. Syft takes the format as an argument, so
          # the switch has nowhere useful to live here — change the task if you
          # need SPDX.
          - task: sbom
            file: repo/ci/tasks/sbom.yml
          - task: sbom-check
            file: repo/ci/tasks/sbom-check.yml
        ensure:
          # `ensure:` guarantees the BLOCK runs, not each step in it — and `do:`
          # is sequential and short-circuits. With these two as a plain `do:`,
          # any upload failure skipped the evidence record entirely, so the
          # exact condition the preflight exists to detect (Mykronos
          # unreachable) also silently suppressed the atlas report.
          #
          # The upload now carries its own `ensure:`, so the evidence record runs
          # either way. This is the same reasoning as the outer `ensure:`,
          # applied one level down.
          do:
            - task: upload
              file: repo/ci/tasks/mykronos-upload.yml
              params:
                <<: *mykronos_upload_params
                CAPABILITY: atlas
                TOOL: osv-scanner
                TRIGGERED_BY: schedule
              ensure:
                task: atlas-evidence
                file: repo/ci/tasks/atlas-evidence.yml
                params:
                  MYKRONOS_INGESTION_URL: ((mykronos_ingestion_url))
                  MYKRONOS_INGESTION_TOKEN: ((mykronos_ingestion_token))
                  MYKRONOS_REF: ((mykronos_ref))
                  REPO_SLUG: ((github_owner))/((github_repo))

  # ── Platform integrity ──────────────────────────────────────────────────────
  # The non-GitHub half of pr-governance.yml. That workflow is retired (TheHub
  # #60849), so this is now the ONLY place these checks run, after the merge.
  # Per the control-assessment skill: TEST beats EXAMINE.

  - name: platform-integrity
    public: true
    plan:
      - get: repo
        trigger: true
      - get: daily-0600
        trigger: true
      - task: platform-integrity
        file: repo/ci/tasks/platform-integrity.yml

  # ── AI assurance ────────────────────────────────────────────────────────────
  # A prompt change is a code change. The scheduled run is the control that
  # catches the failure mode unique to hosted models: the provider updates the
  # model, behavior changes, and there is no diff on your side to notice.

  # NO `ai-evals` OR `ai-guardrails` (TheHub #60850, 2026-10-20). keel has no
  # AI feature to evaluate: both stages echoed "ADAPT: run your eval harness" /
  # "ADAPT: run the guardrail test suite" and exited 0, every week, as green
  # evidence of AI assurance that did not happen. The stages stay in
  # ci/scripts/ai.sh as TEMPLATE for a fork that ships an AI feature, and fail
  # until adapted. `agent-assurance` is real (it runs the agent evals and the
  # tool-grant drift check) and stays.

  - name: agent-assurance
    public: true
    plan:
      - get: repo
      - get: weekly
        trigger: true
      - task: agent-assurance
        file: repo/ci/tasks/ai.yml
        params: { STAGE: agent-assurance }

  # ── Compliance & continuous monitoring ──────────────────────────────────────
  # Scheduled rather than event-driven, because the risk changes while your code
  # does not. A clean scan at build time says nothing about a CVE published
  # yesterday.

  # NO `compliance-daily`, `compliance-weekly` OR `metrics-snapshot` (TheHub
  # #60850, 2026-10-20). Each was an `echo "ADAPT: ..."` that exited 0: a daily
  # "deployed artifact rescan" of a template with no deployment, a weekly drift
  # check against an IaC baseline that does not exist, a metrics snapshot that
  # wrote nothing. Green builds every day, read as CA-7 monitoring. The periods
  # stay in ci/scripts/compliance.sh as TEMPLATE, and fail until adapted.
  # `compliance-monthly` stays: it runs the tool-grant audit, the guard self-test
  # and the agent evals for real.

  # Fires weekly, executes on the first Monday of the month. See the cadence note
  # in ci/scripts/compliance.sh — a run that is not due says so loudly rather
  # than reporting a clean month it never looked at.
  - name: compliance-monthly
    public: true
    plan:
      - get: repo
      - get: weekly
        trigger: true
      - task: compliance
        file: repo/ci/tasks/compliance.yml
        params:
          PERIOD: monthly
          REPO_SLUG: ((github_owner))/((github_repo))

  # ── Supply chain ────────────────────────────────────────────────────────────
  # Build once, inventory it, sign it, verify it. The artifact tested in staging
  # is byte-identical to the one that reaches production. Never rebuild per
  # environment — a rebuild invalidates every test that came before it.

  - name: build-and-attest
    public: true
    serial: true
    on_failure:
      task: check-run
      file: repo/ci/tasks/check-run.yml
      # Three attempts of 45s plus two 5s delays is 145s; 5m is twice that.
      timeout: 5m
      params: { <<: *check_run_params, JOB: build-and-attest, PHASE: end, CONCLUSION: failure }
    on_error:
      task: check-run
      file: repo/ci/tasks/check-run.yml
      # Three attempts of 45s plus two 5s delays is 145s; 5m is twice that.
      timeout: 5m
      params: { <<: *check_run_params, JOB: build-and-attest, PHASE: end, CONCLUSION: failure }
    plan:
      # The gather. Every verifying lane, on the same commit, before anything
      # is signed: an attestation over a tree that failed SAST or SCA is a
      # signature on a known-bad artifact. It used to be `passed: [full-suite]`,
      # which reached build/lint/test through a stub and no scanner at all.
      - get: repo
        trigger: true
        passed: [build, lint, test, sast, secrets, sca, iac]
      # The SBOM is generated HERE, in this job. It was previously taken as an
      # optional input, which could never arrive: syft runs in `mykronos-atlas`,
      # and Concourse does not pass task outputs between jobs. So the branch was
      # unreachable and every build printed "CM-8 is not satisfied" and went
      # green. Generating it in-job also makes the inventory describe the tree
      # that was actually built, which is what CM-8 asks for.
      - task: sbom
        file: repo/ci/tasks/sbom.yml
      - task: sbom-check
        file: repo/ci/tasks/sbom-check.yml
      - task: build-and-attest
        file: repo/ci/tasks/supply-chain.yml
        params:
          STAGE: build-and-attest
          COSIGN_VERSION: ((cosign_version))
          COSIGN_SHA256: ((cosign_sha256))
          REGISTRY: ((registry))

  # This job exists because a signature nobody verifies is decoration. The same
  # verification MUST run in the deploy path and MUST refuse on mismatch —
  # verifying only here proves the signature was made, not that it is checked
  # before use.
  - name: verify-artifact
    public: true
    on_failure:
      task: check-run
      file: repo/ci/tasks/check-run.yml
      # Three attempts of 45s plus two 5s delays is 145s; 5m is twice that.
      timeout: 5m
      params: { <<: *check_run_params, JOB: verify-artifact, PHASE: end, CONCLUSION: failure }
    on_error:
      task: check-run
      file: repo/ci/tasks/check-run.yml
      # Three attempts of 45s plus two 5s delays is 145s; 5m is twice that.
      timeout: 5m
      params: { <<: *check_run_params, JOB: verify-artifact, PHASE: end, CONCLUSION: failure }
    plan:
      - get: repo
        passed: [build-and-attest]
        trigger: true
      - task: verify
        file: repo/ci/tasks/supply-chain.yml
        params:
          STAGE: verify
          COSIGN_VERSION: ((cosign_version))
          COSIGN_SHA256: ((cosign_sha256))
          REGISTRY: ((registry))
      # Last, so it runs only once the whole chain has passed on this commit:
      # this is the step that turns `Concourse / keel` green.
      - task: check-run
        file: repo/ci/tasks/check-run.yml
        timeout: 5m
        params: { <<: *check_run_params, JOB: verify-artifact, PHASE: end, CONCLUSION: success }

  # ── Release (G5) is NOT in this pipeline (POAM-016, TheHub #60935) ───────────
  #
  # `release-preflight` and `authorize-release` were deleted on 2026-10-22. The
  # one release path is .github/workflows/release.yml: the same preflight
  # checks, then a job in the `production` environment that cannot start until
  # a required reviewer approves, and refuses if no approval is recorded.
  #
  # A job here could only ever be authorised by pressing it. Triggering and
  # approving were one act, nothing required the approver to differ from the
  # author, and anyone on the team could press it (POAM-010). That is weaker
  # than the environment gate, and keeping both was two release paths that
  # disagreed about what a release is.
