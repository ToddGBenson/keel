# Scheduled sprint runner — descriptions in sprint/inbox/ become tested PRs.
# Controls: CM-3 (traceability), AIC-11 (bounded autonomy), AC-5 (a human still merges)
#
# ── WHAT THIS DOES AND DOES NOT DO ───────────────────────────────────────────
# Runs the full pipeline autonomously and opens a PR. It does NOT merge, deploy, or touch
# production. The merge stays a human act — that is the control (POAM-008), not an
# oversight, and `permissions:` below is scoped so this job *cannot* merge even if asked.
#
# ── SETUP (you, once) ────────────────────────────────────────────────────────
# Add ANTHROPIC_API_KEY as a repository secret. Agents never handle credentials (AIC-5),
# so this is a step only a human performs:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#
# Without it the workflow exits early and says so, rather than failing obscurely.

name: Sprint Runner

on:
  schedule:
    # Weekly, Monday 06:00 UTC — before the working day, so results are waiting.
    # Change to '0 6 * * *' for daily.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      description_file:
        description: 'Process one file (blank = whole inbox)'
        required: false
        type: string

permissions:
  contents: write        # commit and push the branch
  pull-requests: write   # open the PR
  issues: write          # create the tracking issue (CM-3)
  # Deliberately ABSENT: no packages, no deployments, no id-token. This job cannot
  # publish, deploy, or assume a cloud role — least agency, enforced by the token
  # rather than by asking the agent nicely (AIC-3).

concurrency:
  group: sprint-runner
  cancel-in-progress: false   # never interrupt a half-finished build

jobs:
  sprint:
    name: Build queued descriptions
    runs-on: ubuntu-latest
    timeout-minutes: 45      # a runaway loop costs money; bound it (AIC-11 #6)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Is there anything queued?
        id: queue
        run: |
          n=$(find sprint/inbox -name '*.md' 2>/dev/null | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          [ "$n" -eq 0 ] && echo "Inbox empty — nothing to build." >> "$GITHUB_STEP_SUMMARY"

      - name: Check for the API key
        if: steps.queue.outputs.count != '0'
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            {
              echo "### Sprint runner not configured"
              echo ""
              echo "\`ANTHROPIC_API_KEY\` is not set as a repository secret, so the runner"
              echo "cannot execute. **${{ steps.queue.outputs.count }} description(s) are still"
              echo "queued** and nothing was lost."
              echo ""
              echo "Add it: Settings → Secrets and variables → Actions. Agents never handle"
              echo "credentials (AIC-5), so this is a step only you can perform."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: '22'

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        if: steps.key.outputs.ready == 'true'
        with:
          python-version: '3.12'

      - name: Install Claude Code
        if: steps.key.outputs.ready == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure the committing identity
        if: steps.key.outputs.ready == 'true'
        run: |
          # noreply address — the runner must not publish a personal email (see EXC-001).
          git config user.name  "keel sprint runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run the queue
        if: steps.key.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.description_file }}" ]; then
            bash scripts/sprint.sh --one "${{ inputs.description_file }}"
          else
            bash scripts/sprint.sh
          fi

      - name: Report
        if: always() && steps.key.outputs.ready == 'true'
        run: |
          {
            echo "### Sprint run complete"
            echo ""
            echo "Open PRs are waiting for review. **Merging is deliberately not automated** —"
            echo "a human authorizing the change is the control that separates this from a"
            echo "system that writes code unsupervised (AC-5, POAM-008)."
            echo ""
            echo "Any \`*.BLOCKED.md\` in \`sprint/done/\` means the runner stopped on purpose."
            echo "Stopping is a success state (AIC-11), not a failure."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sprint-logs
          path: sprint/done/*.log
          retention-days: 30
          if-no-files-found: ignore
