# Suppression audit. Refs: #42
#
# A suppression with no rationale and no expiry is a control failure. Blanket
# suppressions are how a scanner quietly stops being a control.
#
# Scans CODE, not prose. The first run of this job in Actions failed against the
# platform's own documentation, which necessarily quotes these tokens while
# explaining the rule. That is L0007: a checker that fires on documentation about
# the thing gets muted, and a muted control detects nothing.
platform: linux

# Half the default cpu weight: these containers share one host with production.
# No memory limit: on these cgroup v2 workers one stops the container being
# created at all (mykronos D-174); the worker containers carry the memory cap.
# See ci/README.md, "Container limits"; test/container-limits.test.py holds it.
container_limits:
  cpu: 512

image_resource:
  type: registry-image
  source:
    repository: python
    tag: "3.13"

inputs:
  - name: repo

run:
  path: bash
  args: [repo/ci/scripts/suppression-audit.sh]
