# Fail fast if Mykronos is unreachable. Refs: #42
#
# Better to stop in ten seconds than scan for twenty minutes and find at upload
# time that the results have nowhere to go — and silently skipping is not an
# option.
platform: linux

# Half the default cpu weight: these containers share one host with production.
# No memory limit: on these cgroup v2 workers one stops the container being
# created at all (mykronos D-174); the worker containers carry the memory cap.
# See ci/README.md, "Container limits"; test/container-limits.test.py holds it.
container_limits:
  cpu: 512

image_resource:
  type: registry-image
  source:
    repository: python
    tag: "3.13"

inputs:
  - name: repo

params:
  MYKRONOS_INGESTION_URL: ""
  MYKRONOS_INGESTION_TOKEN: ""

run:
  path: bash
  args: [repo/ci/scripts/mykronos-preflight.sh]
