# Continuous monitoring & evidence collection. Refs: #42
#
# Scheduled rather than event-driven, because the risk changes while your code
# does not. PERIOD selects the bundle: daily | weekly | monthly | metrics.
platform: linux

# Half the default cpu weight: these containers share one host with production.
# No memory limit: on these cgroup v2 workers one stops the container being
# created at all (mykronos D-174); the worker containers carry the memory cap.
# See ci/README.md, "Container limits"; test/container-limits.test.py holds it.
container_limits:
  cpu: 512

image_resource:
  type: registry-image
  source:
    repository: python
    tag: "3.13"

inputs:
  - name: repo

outputs:
  - name: compliance-evidence

params:
  PERIOD: ""
  # No GITHUB_TOKEN. compliance.sh never read it, and handing a credential to a
  # container with no consumer is exposure without benefit. Add it back in the
  # same change that adds code which uses it.
  REPO_SLUG: ""

run:
  path: bash
  args: [repo/ci/scripts/compliance.sh]
