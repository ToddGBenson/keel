# Release — G5. Refs: #42
#
# STAGE selects: preflight | staging | production.
#
# ⚠️  THE GATE DID NOT SURVIVE THE PORT INTACT ⚠️
#
# On Actions, production was an `environment:` with required reviewers. The job
# physically could not start until a named human approved in the GitHub UI, and
# that record — identity and timestamp — WAS the CM-3 change approval evidence.
#
# Concourse has no equivalent. STAGE=production runs in a job with no trigger, so
# a human must start it, and Concourse records who. That is weaker in three
# specific ways: there is no approval workflow, no requirement that the approver
# differ from the author, and anyone with pipeline access can trigger it.
#
# Recorded as POAM-010. Do not describe this as equivalent to what it replaced.
platform: linux

image_resource:
  type: registry-image
  source:
    repository: python
    tag: "3.13"

inputs:
  - name: repo

outputs:
  - name: release-evidence

params:
  STAGE: ""
  VERSION: ""
  CHANGE_RECORD: ""
  COSIGN_VERSION: ""
  COSIGN_SHA256: ""
  REGISTRY: ""
  STAGING_URL: ""
  PRODUCTION_URL: ""
  CONCOURSE_URL: ""
  GITHUB_TOKEN: ""
  REPO_SLUG: ""

run:
  path: bash
  args: [repo/ci/scripts/release.sh]
