# IaC & configuration scanning. Refs: #42
#
# Checkov comes from PyPI, pinned. CHECKOV_VERSION has no default — an unpinned
# scanner produces results you cannot reproduce, and the finding count is what
# gates this job.
#
# Same skip-loudly rule as the SCA lane. This defect existed in BOTH jobs in the
# Actions version; fixing one was not fixing the class (L0008).
platform: linux

# Half the default cpu weight: these containers share one host with production.
# No memory limit: on these cgroup v2 workers one stops the container being
# created at all (mykronos D-174); the worker containers carry the memory cap.
# See ci/README.md, "Container limits"; test/container-limits.test.py holds it.
container_limits:
  cpu: 512

image_resource:
  type: registry-image
  source:
    repository: python
    tag: "3.13"

inputs:
  - name: repo

outputs:
  - name: iac-results

params:
  CHECKOV_VERSION: ""

run:
  path: bash
  args: [repo/ci/scripts/checkov.sh]
