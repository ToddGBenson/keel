# Platform manifest — what belongs to the platform, what belongs to your project.
#
# This file is the contract that makes the base repo forkable AND upgradeable. Without it,
# a fork is a one-time copy: the moment the platform improves, every fork is stranded.
#
# Read by scripts/sync-platform.sh. Edit deliberately — moving a path from platform_owned
# to project_owned means that path stops receiving upstream improvements forever.

version: 1

# ── PLATFORM-OWNED ───────────────────────────────────────────────────────────
# Synced from upstream on `sync-platform.sh`. Local edits here WILL be overwritten.
# If you need a change, make it upstream and promote it (see /promote) so every fork
# benefits — that is the whole point of the learning loop.
platform_owned:
  - .claude/agents/
  - .claude/commands/
  - .claude/skills/
  - .claude/hooks/
  - process/gates/
  - platform/
  - scripts/
  # Tests for platform-owned code. `test/` as a whole is project-owned below —
  # a fork's own tests are its own — but these two exercise platform modules and
  # are invoked by merge-required workflows. Without them a fork receives
  # scripts/selfreview-check.js and a pr-governance.yml that runs a test file it
  # does not have: a permanently red required check, whose obvious repair is to
  # delete the step and leave the control untested downstream. Which is the
  # outcome #44 exists to prevent, shipped to every consumer at once.
  - test/selfreview-check.test.js
  - test/dashboard.test.py
  - docs/00-overview.md
  - docs/01-roles.md
  - docs/02-intake-and-discovery.md
  - docs/03-refinement.md
  - docs/04-development.md
  - docs/05-verification.md
  - docs/06-cicd.md
  - docs/07-release-and-change.md
  - docs/08-operate-and-respond.md
  - docs/09-retrospective-and-improvement.md
  - docs/10-definitions.md
  - docs/11-ai-agent-controls.md
  - docs/12-ai-feature-governance.md
  # 13-17 were missing while 12 and 18 were listed, so the gap was invisible by
  # reading — it looked like a complete run of numbered docs. Found by checking
  # coverage per FILE rather than per top-level directory (#58).
  #
  # docs/13 is the worst of the six: it is the document that DEFINES solo
  # operation and POAM-008's compensating control. A fork inheriting the
  # self-review gate would never have received the document explaining what the
  # gate is for.
  - docs/13-solo-operation.md
  - docs/14-fast-lane.md
  - docs/15-tracking.md
  - docs/16-sprint-automation.md
  - docs/17-unattended-operation.md
  - docs/18-automation-policy.md
  - docs/19-batched-verification.md
  - docs/templates/
  # Operating a fork's own infrastructure. Platform-owned because the failure
  # modes are the platform's, not the project's.
  - docs/runbooks/
  - docs/compliance/nist-800-53-control-map.md
  - docs/compliance/ssdf-crosswalk.md
  - docs/compliance/evidence-model.md
  - docs/compliance/assessment-plan.md
  - docs/compliance/ssp-outline.md
  - docs/compliance/cis-supply-chain-map.md
  - docs/lessons/
  # The CLI a solo operator actually types. It was unclassified, so no fork has
  # ever received it — the single most-used entry point in the platform.
  - keel
  # Agent assurance: the runner and the seeded behavioural cases (AIC-12).
  - evals/
  # Line-ending policy. Not cosmetic — CRLF corrupted a stored credential and
  # produced 139 phantom shellcheck findings during the Concourse port.
  - .gitattributes
  - LICENSE
  - NOTICE
  - OPERATING.md
  - CONTRIBUTING.md
  - SETUP.md

# ── PROJECT-OWNED ────────────────────────────────────────────────────────────
# Never touched by sync. Yours entirely, from the moment you bootstrap.
project_owned:
  # Sprint inbox and completed work. A fork's own operating state, never the
  # platform's.
  - sprint/
  - src/
  - lib/
  - app/
  - tests/
  - test/
  - infra/
  - terraform/
  - evidence/
  - docs/adr/                        # your architecture decisions, not the platform's
  - docs/compliance/poam.md          # your open findings
  - docs/compliance/ai-inventory.md  # your AI systems
  # Your gate-liveness numbers, not the platform's. A fork's counts differ from
  # upstream's from its first commit, and shipping ours would hand every fork a
  # ratchet already set to somebody else's position (#67).
  - .control-liveness.json
  # Your reconciled merge strands. Ours reference our PR numbers, which mean
  # something entirely different in your repository (#69).
  - .merge-reconciled.json
  - docs/product/                    # your ideas, epics, product docs
  - README.md                        # rewritten by bootstrap for your project
  - .env.example
  - package.json
  - pyproject.toml
  - go.mod
  - Cargo.toml

# ── MERGE-REQUIRED ───────────────────────────────────────────────────────────
# Both the platform and your project legitimately change these. sync-platform.sh will
# NOT overwrite them; it reports the upstream diff and leaves the merge to a human.
# This is deliberate — silently overwriting a workflow you tuned would break your build,
# and silently skipping it would strand you on an old control set.
merge_required:
  - .github/workflows/
  - .github/CODEOWNERS
  - .github/ISSUE_TEMPLATE/
  - .github/PULL_REQUEST_TEMPLATE.md
  - .github/dependabot.yml
  # The Concourse pipeline (#42). Merge-required for the same reason as
  # .github/workflows/: the platform ships the structure — the lane layout, the
  # skip-loudly rule, the checksum-verified tool fetches — while every fork
  # supplies its own toolchain commands, tool pins, registry and deploy targets.
  # Sync reports the diff; a human merges it.
  - ci/
  # Scanner allowlists: the platform ships a baseline, a fork adds its own
  # fixtures and exclusions. Overwriting either side breaks a real scan.
  - .gitleaks.toml
  # The security contact and disclosure process differ per fork; the structure
  # and the response expectations do not.
  - SECURITY.md
  - .claude/settings.json
  - CLAUDE.md
  - .gitignore
  # Platform ships the schema and its meanings; the fork supplies its own environment and
  # test commands. Both sides legitimately change it, so a human merges the diff.
  - automation-policy.yml

# ── BOOTSTRAP-ONLY ───────────────────────────────────────────────────────────
# Consumed by scripts/bootstrap.sh and removed from the fork afterwards. These describe
# the base repo itself and would be misleading inside a project.
bootstrap_only:
  - platform/stacks/
  - docs/adr/ADR-0001-platform-architecture.md

# ── Placeholders substituted at bootstrap ────────────────────────────────────
placeholders:
  - token: "{{PROJECT_NAME}}"
    prompt: "Project name"
  - token: "{{PROJECT_DESCRIPTION}}"
    prompt: "One-line description"
  - token: "{{GITHUB_ORG}}"
    prompt: "GitHub org or username (for CODEOWNERS)"
  - token: "{{STACK}}"
    prompt: "Stack: node | python | go | rust | none"
